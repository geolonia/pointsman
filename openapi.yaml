openapi: 3.1.0
info:
  title: Pointsman API
  version: 0.1.0
  description: |
    Decision service. A client sends a state; a decision model answers the
    profile's typed questions with probabilities; the profile's policy turns
    the answers into an action.

    In every answer, `p` is the probability of `value`.

    Every request needs an API token: `Authorization: Bearer <token>`. A token
    can be limited to some profiles.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8787
    description: Local development (wrangler dev)
security:
  - bearer: []
paths:
  /v1/decide/{profile}:
    post:
      operationId: decide
      summary: Get a decision from a profile
      parameters:
        - name: profile
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$' }
        - name: version
          in: query
          required: false
          description: Profile version. The latest version when not given.
          schema: { type: integer, minimum: 1 }
        - name: Idempotency-Key
          in: header
          required: false
          description: |
            A repeated request with the same key from the same client gets the
            decision already logged, when the request is the same (profile and
            version, state, ref, decisions); a different request with the same
            key is refused (409 idempotency_conflict). Ignored for test tokens,
            whose decisions are not logged.
          schema: { type: string, pattern: '^[\x21-\x7e]{1,200}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecideRequest' }
            example:
              state: { issue: { title: Login page is blank, body: Since this morning the login page shows nothing. } }
              ref: 'example:123'
      responses:
        '200':
          description: The decision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Decision' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: The token may not use this profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: |
            `resolved_by_person`: the decision this one would replace was resolved by a
            person, and a person's answer stays (docs/decision-chains.md).
            `idempotency_conflict`: the Idempotency-Key was used for a different request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /v1/decisions/{id}:
    get:
      operationId: getDecision
      summary: Get a logged decision with its feedback
      parameters:
        - { $ref: '#/components/parameters/DecisionId' }
      responses:
        '200':
          description: The decision as logged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionRecord' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TestToken' }
        '404':
          description: Unknown decision, or one whose profile this token may not use.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /v1/decisions/{id}/feedback:
    post:
      operationId: submitFeedback
      summary: Correct the answers of a decision
      description: |
        Corrections are checked against the profile version the decision used.
        A decision can get feedback more than once; all of it is kept.
      parameters:
        - { $ref: '#/components/parameters/DecisionId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FeedbackRequest' }
            example:
              correct: { team: frontend }
              by: reviewer@example.com
      responses:
        '204': { description: Feedback stored }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TestToken' }
        '404':
          description: Unknown decision, or one whose profile this token may not use.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: The profile version of the decision is no longer available.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /v1/stats/{profile}:
    get:
      operationId: getProfileStats
      summary: What happened to a profile's decisions in the last days
      description: |
        Counts only, no single decisions or states: decisions per action, the
        review queue (pending, resolved, the final actions people chose), and
        decisions where a person corrected at least one answer. The window
        applies to when a decision was made; a later resolution or correction
        of such a decision counts with it.
      parameters:
        - name: profile
          in: path
          required: true
          schema: { type: string }
        - name: days
          in: query
          required: false
          description: The window, from 1 to 90 days back from now (default 7).
          schema: { type: integer, minimum: 1, maximum: 90, default: 7 }
      responses:
        '200':
          description: The counts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileStats' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: The token may not use this profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Unknown profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /v1/reviews:
    get:
      operationId: listReviews
      summary: List decisions waiting for a human review
      description: Decisions with action `review` that are not resolved yet, oldest first (at most 100), for the profiles this token may use.
      parameters:
        - name: profile
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Pending reviews
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [reviews]
                properties:
                  reviews:
                    type: array
                    items:
                      allOf: [{ $ref: '#/components/schemas/DecisionRecordBase' }]
                      unevaluatedProperties: false
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: The token may not use this profile, or it is a test token (it may only decide).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /v1/reviews/{id}/resolve:
    post:
      operationId: resolveReview
      summary: Resolve a pending review
      description: |
        Sets the final action and answers. Answers in `correct` replace the
        model's (source `human`); the others are kept (source `model`).
        `correct` is also stored as feedback. When the decision has a
        `callback_url`, the final answer is sent there (see "Callbacks").
      parameters:
        - { $ref: '#/components/parameters/DecisionId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveRequest' }
            example: { action: auto, correct: { team: frontend }, by: reviewer@example.com }
      responses:
        '200':
          description: Resolved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Resolution' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TestToken' }
        '404':
          description: Unknown decision, or one whose profile this token may not use.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: The decision has no pending review (not a review, or already resolved), or its profile version is gone.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /v1/profiles:
    get:
      operationId: listProfiles
      summary: List the profiles this token may use, with their versions
      responses:
        '200':
          description: The profiles this token may use (all profiles for a token with scope *)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [profiles]
                properties:
                  profiles:
                    type: array
                    items: { $ref: '#/components/schemas/ProfileSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/Error' }
  /v1/profiles/{id}/graph:
    get:
      operationId: getDecisionGraph
      summary: The decision graph a profile belongs to, for DMN tools
      description: |
        The profile, the profiles it requires and the ones that require it
        (docs/decision-chains.md), among the profiles this token may use, as
        a DMN decision requirements graph. Only the graph: no decision logic.
        With `format=dmn`, DMN 1.3 XML with DMNDI shapes, which DMN tools
        (bpmn.io dmn-js, Camunda Modeler, Apache KIE) open. Not for test tokens.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$' }
        - name: format
          in: query
          required: false
          description: json (the graph), dmn (DMN 1.3 XML with DMNDI) or svg (a small diagram in the style of the datamodels.jp diagrams).
          schema: { type: string, enum: [json, dmn, svg], default: json }
        - name: lang
          in: query
          required: false
          description: The language of the svg diagram's text.
          schema: { type: string, enum: [en, ja], default: en }
      responses:
        '200':
          description: The graph
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionGraph' }
            application/xml:
              schema: { type: string, description: DMN 1.3 (https://www.omg.org/spec/DMN/20191111/MODEL/) with DMNDI }
            image/svg+xml:
              schema: { type: string, description: 'The chain as a small diagram: one box per decision, arrows from the decisions it requires.' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: The token may not use this profile (also a test token).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
components:
  parameters:
    DecisionId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Per-client API token (`pm_` + 43 characters).
  responses:
    TestToken:
      description: A test token, which may only decide.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing, malformed, unknown or revoked token.
      headers:
        WWW-Authenticate:
          schema: { type: string, const: Bearer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    DecideRequest:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state:
          description: |
            What the model decides about: free text, or any JSON object or array.
            When the profile has an `input` mapping, this is the raw client
            payload the mapping reads from.
          oneOf:
            - { type: string, minLength: 1 }
            - { type: object }
            - { type: array }
        ref:
          description: The client's reference for this decision, for example an issue id.
          type: string
          minLength: 1
          maxLength: 200
        callback_url:
          description: Where to send the final answer after a human review (https only).
          type: string
          format: uri
          pattern: '^https://'
        decisions:
          description: |
            For a profile with `requires` (docs/decision-chains.md): the ids of
            the earlier decisions, by the names in `requires`. They are read from
            the decision log and must be of the named profile, in the token's
            scope, with this request's `ref` (then required) and from the same
            client; every other case gives the same 400. Not for test tokens.
          type: object
          minProperties: 1
          maxProperties: 8
          additionalProperties: { type: string, format: uuid }
    DecisionGraph:
      description: A DMN decision requirements graph; node and edge types are DMN's names.
      type: object
      additionalProperties: false
      required: [profile, nodes, edges]
      properties:
        profile: { type: string, description: The profile the graph was asked for. }
        nodes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, type, name]
            properties:
              id: { type: string, pattern: '^[A-Za-z_][A-Za-z0-9._-]*$' }
              type: { type: string, enum: [decision, inputData, businessKnowledgeModel, knowledgeSource] }
              name: { type: string }
              profile: { type: string, description: For decision and businessKnowledgeModel. }
              version: { type: integer, minimum: 1, description: For decision. }
              question: { type: string, description: 'For decision: the profile description.' }
              allowedAnswers: { type: array, items: { type: string }, description: "For decision: the profile's actions and people_answers." }
              model: { type: string, description: For decision and businessKnowledgeModel; none for a rules-only profile. }
              source: { type: string, description: 'For a fact (inputData): the knowledgeSource it is looked up from.' }
              locationURI: { type: string, format: uri, description: For knowledgeSource. }
        edges:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, type, from, to]
            properties:
              id: { type: string, pattern: '^[A-Za-z_][A-Za-z0-9._-]*$' }
              type: { type: string, enum: [informationRequirement, knowledgeRequirement, authorityRequirement] }
              from: { type: string }
              to: { type: string }
              name: { type: string, description: 'For a required decision: its name in the requiring profile.' }
              optional: { type: boolean, const: true, description: 'For a required decision that may not exist.' }
    RequiredSnapshot:
      description: What the rules read from one required decision, when this decision was made.
      type: object
      additionalProperties: false
      required: [decision, profile, profile_version, action, outcome, reviewed, read]
      properties:
        decision: { type: string, format: uuid }
        profile: { type: string }
        profile_version: { type: integer, minimum: 1 }
        action: { type: string }
        outcome: { type: string, description: The person's answer when a review was resolved, otherwise the action. }
        reviewed: { type: boolean }
        read:
          type: object
          description: Every value the rules read from it, by path; null = unknown.
          additionalProperties: {}
    HiddenRequired:
      description: A required decision of a profile the reader may not see.
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: { type: 'null' }
    Decision:
      type: object
      additionalProperties: false
      required: [decision_id, answers, action, profile, profile_version, model, created_at, rule]
      properties:
        decision_id: { type: string, format: uuid }
        ref: { type: string }
        answers:
          type: object
          description: One answer per question, keyed by question name.
          additionalProperties: { $ref: '#/components/schemas/Answer' }
        action:
          description: auto, review, or a custom action defined by the profile.
          type: string
        profile: { type: string }
        profile_version: { type: integer, minimum: 1 }
        model:
          description: The model that answered.
          type: string
        created_at: { type: string, format: date-time, description: When the decision was made. }
        rule:
          description: Index of the policy rule that matched (from 0); null when the default action applied.
          type: [integer, 'null']
          minimum: 0
        facts: { $ref: '#/components/schemas/Facts' }
        test:
          description: Present (true) only for a test token's decision, which is not logged.
          type: boolean
          const: true
        requires:
          description: For a profile with `requires`, by name. A required decision of a profile the token may no longer use is hidden.
          type: object
          additionalProperties:
            oneOf:
              - { $ref: '#/components/schemas/RequiredSnapshot' }
              - { $ref: '#/components/schemas/HiddenRequired' }
        replaces:
          description: The earlier decision of the same profile, ref and client that this one replaces.
          type: string
          format: uuid
        review:
          description: Present when a person checks the decision before it counts (the profile's people_check).
          type: object
          additionalProperties: false
          required: [status]
          properties:
            status: { type: string, const: pending }
    ProfileStats:
      type: object
      additionalProperties: false
      required: [profile, days, since, decisions, actions, reviews, corrected]
      properties:
        profile: { type: string }
        days: { type: integer, minimum: 1, maximum: 90 }
        since: { type: string, format: date-time, description: Decisions made at or after this time are counted. }
        decisions: { type: integer, minimum: 0 }
        actions:
          type: object
          description: Decisions per action.
          additionalProperties: { type: integer, minimum: 0 }
        reviews:
          type: object
          additionalProperties: false
          required: [pending, resolved, superseded, final_actions]
          properties:
            pending: { type: integer, minimum: 0 }
            resolved: { type: integer, minimum: 0 }
            superseded: { type: integer, minimum: 0, description: Reviews closed because a newer decision replaced theirs. }
            final_actions:
              type: object
              description: Resolved reviews per final action.
              additionalProperties: { type: integer, minimum: 0 }
        corrected:
          type: integer
          minimum: 0
          description: Decisions where a person corrected at least one answer (as in docs/accuracy.sql).
    DecisionRecord:
      allOf:
        - $ref: '#/components/schemas/DecisionRecordBase'
        - type: object
          required: [feedback]
          properties:
            feedback:
              type: array
              items: { $ref: '#/components/schemas/Feedback' }
            callback: { $ref: '#/components/schemas/CallbackState' }
      unevaluatedProperties: false
    DecisionRecordBase:
      type: object
      required: [decision_id, created_at, client, profile, profile_version, model, action, rule, answers, state_hash]
      properties:
        decision_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        client: { type: string, description: The client whose token made the decision. }
        ref: { type: string }
        profile: { type: string }
        profile_version: { type: integer, minimum: 1 }
        model: { type: string }
        action: { type: string }
        rule:
          description: Index of the policy rule that matched; null when the default action applied.
          type: [integer, 'null']
          minimum: 0
        answers:
          type: object
          additionalProperties: { $ref: '#/components/schemas/Answer' }
        facts: { $ref: '#/components/schemas/Facts' }
        state_hash: { type: string, pattern: '^[0-9a-f]{64}$', description: SHA-256 of the state sent to the model (keys sorted). }
        state: { description: 'The state sent to the model. Only when the profile sets log.store_state.' }
        review: { $ref: '#/components/schemas/Review' }
        requires:
          description: For a profile with `requires`, by name. A required decision of a profile the reader may not see is hidden.
          type: object
          additionalProperties:
            oneOf:
              - { $ref: '#/components/schemas/RequiredSnapshot' }
              - { $ref: '#/components/schemas/HiddenRequired' }
        idempotency_key: { type: string, description: The Idempotency-Key the decision was made with. }
        replaces: { type: string, format: uuid, description: The earlier decision of the same profile, ref and client that this one replaced. }
        discarded_at:
          type: string
          format: date-time
          description: Made while a person resolved the decision it would replace; the client got 409 resolved_by_person and it never counts.
    Review:
      description: Only for decisions whose action a person checks (the profile's people_check; default review).
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          description: '`superseded`: a newer decision replaced this one while the review was open.'
          type: string
          enum: [pending, resolved, superseded]
        resolved_at: { type: string, format: date-time }
        resolved_by: { type: string }
        final_action: { type: string }
        final_answers: { $ref: '#/components/schemas/FinalAnswers' }
    FinalAnswers:
      type: object
      additionalProperties:
        type: object
        additionalProperties: false
        required: [value, source]
        properties:
          value: {}
          source: { type: string, enum: [model, human] }
    CallbackState:
      description: Delivery of the final answer to the decision's callback_url.
      type: object
      additionalProperties: false
      required: [status, attempts]
      properties:
        status: { type: string, enum: [pending, delivered, failed] }
        attempts: { type: integer, minimum: 0 }
        last_error: { type: string }
        next_at: { type: string, format: date-time }
    ResolveRequest:
      type: object
      additionalProperties: false
      required: [action, by]
      properties:
        action: { type: string, pattern: '^[a-z][a-z0-9_-]{0,62}$', description: 'The final action, e.g. auto; not review.' }
        correct:
          description: Corrected answers by question name (as in feedback). Empty or left out to keep the model's answers.
          type: object
        by: { type: string, minLength: 1, maxLength: 100 }
        note: { type: string, maxLength: 1000 }
    Resolution:
      type: object
      additionalProperties: false
      required: [decision_id, action, answers, resolved_by, resolved_at, callback]
      properties:
        decision_id: { type: string, format: uuid }
        action: { type: string }
        answers: { $ref: '#/components/schemas/FinalAnswers' }
        resolved_by: { type: string }
        resolved_at: { type: string, format: date-time }
        callback:
          type: string
          enum: [pending, none]
          description: pending when the final answer will be sent to the callback_url.
    FeedbackRequest:
      type: object
      additionalProperties: false
      required: [correct, by]
      properties:
        correct:
          description: 'Corrected values by question name: true/false (noul), an option (choice), a level (score).'
          type: object
          minProperties: 1
          additionalProperties:
            oneOf:
              - { type: boolean }
              - { type: string }
              - { type: integer, minimum: 0 }
        by: { type: string, minLength: 1, maxLength: 100, description: Who made the correction. }
        note: { type: string, maxLength: 1000 }
    Feedback:
      type: object
      additionalProperties: false
      required: [created_at, client, by, correct]
      properties:
        created_at: { type: string, format: date-time }
        client: { type: string }
        by: { type: string }
        correct: { type: object }
        note: { type: string }
    Facts:
      description: >-
        Only for profiles with facts (docs/profile-format.md#facts): each fact the profile asked
        for, by name, as looked up for this decision, or why it is missing. A rule that needs a
        missing fact does not match.
      type: object
      additionalProperties: { $ref: '#/components/schemas/Fact' }
    Fact:
      oneOf:
        - type: object
          additionalProperties: false
          required: [missing, values, source]
          properties:
            missing: { const: false }
            values:
              description: Field values of the fact type (inside, nearest, detour); null when a field has no value.
              type: object
              additionalProperties: { type: [string, number, boolean, 'null'] }
            source: { type: string, description: Where the value came from. }
        - type: object
          additionalProperties: false
          required: [missing, reason]
          properties:
            missing: { const: true }
            reason:
              description: >-
                no_location (no Point or LineString at the fact's path), unavailable (no fact
                provider configured), timeout, or error.
              enum: [no_location, unavailable, timeout, error]
    Answer:
      oneOf:
        - $ref: '#/components/schemas/NoulAnswer'
        - $ref: '#/components/schemas/ChoiceAnswer'
        - $ref: '#/components/schemas/ScoreAnswer'
    NoulAnswer:
      type: object
      additionalProperties: false
      required: [type, value, p, 'yes']
      properties:
        type: { const: noul }
        value: { type: boolean, description: 'true when P(yes) >= 0.5' }
        p: { $ref: '#/components/schemas/Probability' }
        'yes': { $ref: '#/components/schemas/Probability' }
    ChoiceAnswer:
      type: object
      additionalProperties: false
      required: [type, value, p, probabilities]
      properties:
        type: { const: choice }
        value: { type: string, description: The most likely option. }
        p: { $ref: '#/components/schemas/Probability' }
        probabilities: { $ref: '#/components/schemas/Probabilities' }
    ScoreAnswer:
      type: object
      additionalProperties: false
      required: [type, value, p, score, probabilities]
      properties:
        type: { const: score }
        value: { type: integer, minimum: 0, description: The most likely level, 0 = lowest. }
        p: { $ref: '#/components/schemas/Probability' }
        score: { type: number, minimum: 0, description: Probability-weighted level; can fall between levels. }
        probabilities:
          $ref: '#/components/schemas/Probabilities'
          description: Probability per level, keyed by level index.
    Probability: { type: number, minimum: 0, maximum: 1 }
    Probabilities:
      type: object
      additionalProperties: { $ref: '#/components/schemas/Probability' }
    ProfileSummary:
      type: object
      additionalProperties: false
      required: [id, version, versions, title, description]
      properties:
        id: { type: string }
        version: { type: integer, minimum: 1, description: Latest version. }
        versions: { type: array, items: { type: integer, minimum: 1 } }
        title: { $ref: '#/components/schemas/BilingualText' }
        description: { $ref: '#/components/schemas/BilingualText' }
        requires:
          description: The profile ids the latest version requires (decision chains, docs/decision-chains.md).
          type: array
          items: { type: string }
    BilingualText:
      type: object
      additionalProperties: false
      required: [en, ja]
      properties:
        en: { type: string }
        ja: { type: string }
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum: [invalid_request, unauthorized, forbidden, profile_not_found, decision_not_found, profile_version_gone, not_pending, not_found, resolved_by_person, idempotency_conflict, model_error, internal_error]
            message: { type: string }
