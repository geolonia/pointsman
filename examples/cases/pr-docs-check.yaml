# Test cases for pr-docs-check: each rule, and each fact missing.
profile: pr-docs-check
cases:
  - name: a small docs change with green checks gets a light review
    expect: light
    answers: { changes_behaviour: 0.05 }
    facts:
      pr: { open: true, merged: false, draft: false, wip_title: false, files: 2, changed_lines: 30, base_is_default: true, author_member: true, author_dependabot: false, fork: false, all_commits_verified: true, pushed_by_author: 'yes', author_sole_code_owner: false }
      docs: { any: true, all: true, count: 2 }
      ci: { required: 1, green: true, pending: false, failed: false }

  - name: a docs change that may alter a command gets a full review
    expect: review
    answers: { changes_behaviour: 0.6 }
    facts:
      pr: { open: true, merged: false, draft: false, wip_title: false, files: 2, changed_lines: 30, base_is_default: true, author_member: true, author_dependabot: false, fork: false, all_commits_verified: true, pushed_by_author: 'yes', author_sole_code_owner: false }
      docs: { any: true, all: true, count: 2 }
      ci: { required: 1, green: true, pending: false, failed: false }

  - name: one code file means a full review
    expect: review
    answers: { changes_behaviour: 0.05 }
    facts:
      pr: { open: true, merged: false, draft: false, wip_title: false, files: 3, changed_lines: 30, base_is_default: true, author_member: true, author_dependabot: false, fork: false, all_commits_verified: true, pushed_by_author: 'yes', author_sole_code_owner: false }
      docs: { any: true, all: false, count: 2 }
      ci: { required: 1, green: true, pending: false, failed: false }

  - name: a change from a fork means a full review
    expect: review
    answers: { changes_behaviour: 0.05 }
    facts:
      pr: { open: true, merged: false, draft: false, wip_title: false, files: 2, changed_lines: 30, base_is_default: true, author_member: false, author_dependabot: false, fork: true, all_commits_verified: true, pushed_by_author: 'yes', author_sole_code_owner: false }
      docs: { any: true, all: true, count: 2 }
      ci: { required: 1, green: true, pending: false, failed: false }

  - name: more than 200 changed lines means a full review
    expect: review
    answers: { changes_behaviour: 0.05 }
    facts:
      pr: { open: true, merged: false, draft: false, wip_title: false, files: 2, changed_lines: 201, base_is_default: true, author_member: true, author_dependabot: false, fork: false, all_commits_verified: true, pushed_by_author: 'yes', author_sole_code_owner: false }
      docs: { any: true, all: true, count: 2 }
      ci: { required: 1, green: true, pending: false, failed: false }

  - name: an unsigned commit means a full review
    expect: review
    answers: { changes_behaviour: 0.05 }
    facts:
      pr: { open: true, merged: false, draft: false, wip_title: false, files: 2, changed_lines: 30, base_is_default: true, author_member: true, author_dependabot: false, fork: false, all_commits_verified: false, pushed_by_author: 'yes', author_sole_code_owner: false }
      docs: { any: true, all: true, count: 2 }
      ci: { required: 1, green: true, pending: false, failed: false }

  - name: unknown signatures (too many commits) mean a full review
    expect: review
    answers: { changes_behaviour: 0.05 }
    facts:
      pr: { open: true, merged: false, draft: false, wip_title: false, files: 2, changed_lines: 30, base_is_default: true, author_member: true, author_dependabot: false, fork: false, all_commits_verified: null, pushed_by_author: 'yes', author_sole_code_owner: false }
      docs: { any: true, all: true, count: 2 }
      ci: { required: 1, green: true, pending: false, failed: false }

  - name: no required checks means a full review
    expect: review
    answers: { changes_behaviour: 0.05 }
    facts:
      pr: { open: true, merged: false, draft: false, wip_title: false, files: 2, changed_lines: 30, base_is_default: true, author_member: true, author_dependabot: false, fork: false, all_commits_verified: true, pushed_by_author: 'yes', author_sole_code_owner: false }
      docs: { any: true, all: true, count: 2 }
      ci: { required: 0, green: false, pending: false, failed: false }

  - name: running checks mean wait
    expect: wait
    answers: { changes_behaviour: 0.05 }
    facts:
      pr: { open: true, merged: false, draft: false, wip_title: false, files: 2, changed_lines: 30, base_is_default: true, author_member: true, author_dependabot: false, fork: false, all_commits_verified: true, pushed_by_author: 'yes', author_sole_code_owner: false }
      docs: { any: true, all: true, count: 2 }
      ci: { required: 1, green: false, pending: true, failed: false }

  - name: a draft waits
    expect: wait
    answers: { changes_behaviour: 0.05 }
    facts:
      pr: { open: true, merged: false, draft: true, wip_title: false, files: 2, changed_lines: 30, base_is_default: true, author_member: true, author_dependabot: false, fork: false, all_commits_verified: true, pushed_by_author: 'yes', author_sole_code_owner: false }
      docs: { any: true, all: true, count: 2 }
      ci: { required: 1, green: true, pending: false, failed: false }

  - name: WIP in the title waits
    expect: wait
    answers: { changes_behaviour: 0.05 }
    facts:
      pr: { open: true, merged: false, draft: false, wip_title: true, files: 2, changed_lines: 30, base_is_default: true, author_member: true, author_dependabot: false, fork: false, all_commits_verified: true, pushed_by_author: 'yes', author_sole_code_owner: false }
      docs: { any: true, all: true, count: 2 }
      ci: { required: 1, green: true, pending: false, failed: false }

  - name: a merged pull request is done, even with checks missing
    expect: done
    answers: { changes_behaviour: 0.05 }
    facts:
      pr: { open: false, merged: true, draft: false, wip_title: false, files: 2, changed_lines: 30, base_is_default: true, author_member: true, author_dependabot: false, fork: false, all_commits_verified: true, pushed_by_author: 'yes', author_sole_code_owner: false }
      docs: { any: true, all: true, count: 2 }
      ci: { missing: error }

  - name: a newer commit means retry
    expect: retry
    answers: { changes_behaviour: 0.05 }
    facts: { pr: { missing: stale }, docs: { missing: stale }, ci: { missing: stale } }

  - name: missing paths mean retry
    expect: retry
    answers: { changes_behaviour: 0.05 }
    facts:
      pr: { open: true, merged: false, draft: false, wip_title: false, files: 2, changed_lines: 30, base_is_default: true, author_member: true, author_dependabot: false, fork: false, all_commits_verified: true, pushed_by_author: 'yes', author_sole_code_owner: false }
      docs: { missing: error }
      ci: { required: 1, green: true, pending: false, failed: false }

  - name: missing checks mean retry
    expect: retry
    answers: { changes_behaviour: 0.05 }
    facts:
      pr: { open: true, merged: false, draft: false, wip_title: false, files: 2, changed_lines: 30, base_is_default: true, author_member: true, author_dependabot: false, fork: false, all_commits_verified: true, pushed_by_author: 'yes', author_sole_code_owner: false }
      docs: { any: true, all: true, count: 2 }
      ci: { missing: timeout }

  - name: no GitHub access means retry
    expect: retry
    answers: { changes_behaviour: 0.05 }
    facts: { pr: missing, docs: missing, ci: missing }
