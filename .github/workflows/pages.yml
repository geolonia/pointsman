name: Pages

# The website moved to https://pointsman.net (a Cloudflare Worker that
# Cloudflare's GitHub app builds and deploys from main: docs-site/wrangler.jsonc).
# GitHub Pages now only sends the old address, geolonia.github.io/pointsman/,
# to the new one, keeping the path. Run by hand from main, once
# https://pointsman.net answers, so the old address never points at a site
# that is not live yet; until then GitHub Pages keeps the last landing page.
on:
  workflow_dispatch:

permissions: {}

# One deployment at a time; a newer push replaces a waiting one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  upload:
    name: Upload the redirect
    # A manual run from another branch must not publish that branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same page for /, /ja/ and (as 404.html) every other old path.
      - name: Put the redirect together
        run: |
          mkdir -p _redirect/ja
          cp .github/pages-redirect/index.html _redirect/index.html
          cp .github/pages-redirect/index.html _redirect/ja/index.html
          cp .github/pages-redirect/index.html _redirect/404.html

      - name: Upload the redirect
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _redirect

  deploy:
    name: Deploy to GitHub Pages
    needs: upload
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
