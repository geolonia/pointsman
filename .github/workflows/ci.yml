name: CI

# Runs the validator tests and validates the example profiles on every pull
# request and on main.
#
# No `paths` filter on purpose: this check is meant to be required on main, and
# a filtered workflow never reports on PRs it skips, which blocks them forever.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Test and validate profiles
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      # Each invalid fixture must fail for the reason it names.
      - name: Test
        run: npm test

      - name: Validate example profiles
        run: npm run validate:profiles
