name: CI

# Typechecks, tests and validates on every pull request and on main, and
# dry-runs the Worker deploy. It does NOT deploy: deployments come from a
# private config repository with its own wrangler config (see issue #10).
#
# No `paths` filter on purpose: this check is meant to be required on main, and
# a filtered workflow never reports on PRs it skips, which blocks them forever.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Test and validate profiles
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pnpm version from "packageManager" in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Generates the runtime types with `wrangler types`, then runs tsc.
      - name: Typecheck
        run: pnpm typecheck

      # Script tests (each invalid fixture must fail for the reason it names)
      # and Worker tests in workerd (responses checked against openapi.yaml).
      - name: Test
        run: pnpm test

      - name: Validate example profiles
        run: pnpm validate:profiles

      # The example profiles' test cases, with their rules only (no model).
      - name: Run example test cases
        run: pnpm test:cases

      # This repository is public: no account ids, resource ids or real profiles.
      - name: Check for organization-specific data
        run: pnpm check:public

      # The generated reference pages match the code, every docs page has an
      # English and a Japanese version, and every linked file exists. Anchors
      # are checked by the docs build (job "docs").
      - name: Check the docs
        run: pnpm docs:check

      # Bundles the Worker and validates wrangler.jsonc without touching
      # Cloudflare.
      - name: Dry-run deploy
        run: pnpm deploy:dry-run

  docs:
    name: Build the docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The same build as Cloudflare's (docs-site/wrangler.jsonc): the docs
      # with their link check, then the whole site in _site/.
      - name: Build the site
        run: pnpm site:build

      # Checks the Worker's config and its files without touching Cloudflare.
      - name: Dry-run the site deploy
        run: pnpm exec wrangler deploy --dry-run --config docs-site/wrangler.jsonc
        env:
          WRANGLER_SEND_METRICS: 'false'
