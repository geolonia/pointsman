# Dependabot config for the Geolonia GitHub Actions pinning standard.
#
# Dependabot keeps SHA pins current: it bumps both the commit SHA and the
# trailing version comment, so SHA-pinning never goes stale. The 8-day cooldown
# is one day longer than the `.pinact.yml` min_age of 7 (Dependabot counts whole
# calendar days while pinact enforces an exact 168h floor), so a Dependabot PR
# always clears the Action Pinning Check on arrival.
#
# Add more ecosystems (npm, pip, docker, ...) under `updates:` as the repo grows.
# Adoption (Backstage scaffolder or manual copy) and how to merge into an
# existing dependabot.yml are documented in docs/github-actions-pinning.md.
version: 2
updates:
  - package-ecosystem: github-actions
    # The config repository template's workflows too: config repositories
    # copy them, so their pins should be as current as this repository's.
    # Only "/" also scans .github/workflows; any other directory is read
    # as is, so the template's workflows folder is named itself.
    directories:
      - /
      - /template/config-repo/.github/workflows
    schedule:
      interval: weekly
    cooldown:
      default-days: 8
    groups:
      # Batch minor and patch bumps into a single weekly PR. Majors are
      # excluded here, so breaking upgrades arrive as individual PRs that get
      # isolated review. Security updates also stay individual (groups defaults
      # to applies-to: version-updates).
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # "npm" also covers pnpm (it reads pnpm-lock.yaml).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 8
    # A dependency goes to the first group it matches. Patch bumps of dev
    # dependencies come in a PR of their own, which Pointsman may approve
    # on facts alone (the bump class); a PR with any minor step or runtime
    # dependency is not approvable, so the rest stays in a second PR that
    # gets a CodeRabbit review.
    groups:
      npm-dev-patch:
        dependency-type: development
        update-types:
          - patch
      npm:
        update-types:
          - minor
          - patch
    ignore:
      # @cloudflare/vitest-plugin supports only vitest 4 (peer ^4.1.0). Remove
      # this when the plugin supports the next major.
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
