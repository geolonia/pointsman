<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pointsman has moved to pointsman.net</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://pointsman.net/">
<!-- The old address (geolonia.github.io/pointsman/...). GitHub Pages serves
     this file for /, /ja/ and, as 404.html, every other path, so the script
     keeps the path. Without JavaScript the refresh goes to the start page. -->
<script>
  location.replace('https://pointsman.net' + location.pathname.replace(/^\/pointsman(?=\/|$)/, '') + location.search + location.hash);
</script>
<meta http-equiv="refresh" content="0; url=https://pointsman.net/">
</head>
<body>
<p>Pointsman has moved to <a href="https://pointsman.net/">pointsman.net</a>.</p>
<p lang="ja">Pointsman のサイトは <a href="https://pointsman.net/ja/">pointsman.net</a> に移りました。</p>
</body>
</html>
