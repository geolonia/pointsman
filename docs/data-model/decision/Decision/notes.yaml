notes:
  - ja: 来歴の部分は W3C PROV-O（https://www.w3.org/TR/prov-o/ 、W3C 勧告 2013）に基づく。判定は prov:Activity。refersTo は prov:used、decidedAt は prov:endedAtTime、wasInformedBy は prov:wasInformedBy。答えたモデルは prov:SoftwareAgent、規則の集まりとその版は prov:Plan に当たるが、NGSI-LD で扱いやすいよう model・profile・profileVersion は値（ID）で持つ。正式な PROV-O にするには、モデルと規則の版に IRI を与え、prov:qualifiedAssociation（prov:agent と prov:hadPlan）を足す。人による確認は PROV-O では別の活動だが、使う側を単純にするため同じエンティティに持つ。
    en: "The provenance part rests on W3C PROV-O (https://www.w3.org/TR/prov-o/, W3C Recommendation 2013). A decision is a prov:Activity: refersTo is prov:used, decidedAt prov:endedAtTime, wasInformedBy prov:wasInformedBy. The model that answered is a prov:SoftwareAgent and the rule set version a prov:Plan; model, profile and profileVersion are plain values (ids) so they are easy to use in NGSI-LD. Full PROV-O would mint IRIs for models and rule set versions and add a prov:qualifiedAssociation (prov:agent, prov:hadPlan). The check by a person is a separate activity in PROV-O; it is kept on the same entity to keep consumers simple."
  - ja: W3C/OGC SOSA/SSN（https://www.w3.org/TR/vocab-ssn/ ）は PROV-O との対応を公開しており、同じ形になる。sosa:hasFeatureOfInterest ⊑ prov:used（refersTo）、sosa:madeBySensor ⊑ prov:wasAssociatedWith（model）、sosa:usedProcedure（profile）、sosa:resultTime ⊑ prov:endedAtTime（2017 年版。2023 年版の草案では sosa:endTime）。型としては使わない。1 つの観測は 1 つの結果しか持たず、問いを「観測できる性質」とみなすのは無理があるため。
    en: "W3C/OGC SOSA/SSN (https://www.w3.org/TR/vocab-ssn/) publishes its own alignment to PROV-O with the same shape: sosa:hasFeatureOfInterest ⊑ prov:used (refersTo), sosa:madeBySensor ⊑ prov:wasAssociatedWith (model), sosa:usedProcedure (profile), sosa:resultTime ⊑ prov:endedAtTime (2017; sosa:endTime in the 2023 draft). Not used as the type: one observation has one result, and a question is not really an observable property."
  - ja: humanInvolvement の値は W3C DPV 2.3（https://w3c-cg.github.io/dpv/2.3/dpv/ 、W3C コミュニティグループ報告書）の語。DPV は処理の種類を表す語彙で、判定 1 件の記録は持たないので、人の関わり方の語だけを借りた。
    en: "The values of humanInvolvement are W3C DPV 2.3 terms (https://w3c-cg.github.io/dpv/2.3/dpv/, W3C Community Group report). DPV describes kinds of processing, not single decision records, so only its human-involvement terms are borrowed."
  - ja: 検討した上流（2026-10-07）。Smart Data Models の SMAnalysis（SocialMedia、1 件の分析に 1 つの値と 1 つの確信度）が最も近いが、複数の答えも人の確認も無い。MLModel・MLProcessing（モデルとジョブの記述）、Alert・Anomaly・AIPrediction・DataQualityAssessment、schema.org の AssessAction・ChooseAction、ML Schema、FAIR4ML、AIRO・VAIR、DMN は型として合わない。ETSI ISG CIM に AI の結果のモデルは無い。確率の標準（DQV、ISO 19156 の結果の品質、UncertML、QUDT）は選択肢ごとの確率に合わないので、probability と probabilities は独自の項目にした。比較の全体は geolonia/pointsman の docs/decision-model-standards.md。
    en: "Upstream considered (2026-10-07). Smart Data Models SMAnalysis (SocialMedia: one analysis with one value and one confidence) is the closest, but has no multiple answers and no review. MLModel and MLProcessing (descriptions of models and jobs), Alert, Anomaly, AIPrediction, DataQualityAssessment, schema.org AssessAction and ChooseAction, ML Schema, FAIR4ML, AIRO, VAIR and DMN do not fit as the type. ETSI ISG CIM has no model for AI results. The probability standards checked (DQV, ISO 19156 result quality, UncertML, QUDT) do not fit a probability per option, so probability and probabilities are our own. The full comparison is docs/decision-model-standards.md in geolonia/pointsman."
  - ja: 法令・指針（2026-10-07 確認）は記録の形式を定めないが、policyRule（判定根拠）は AI事業者ガイドライン 第1.2版の 6)① とデジタル庁 DS-920 の 6.5 がログに求める項目、humanInvolvement は人の関わり方を記録する項目で、GDPR 第22条(3)・第13〜15条、AI 法（EU）第26条(11)・第86条、AI事業者ガイドラインの U-7 が求める対応に役立つ。保存期間はモデルの項目ではなく運用の設定。
    en: "Laws and guidelines (checked 2026-10-07) define no record format. policyRule (the reason for the result) is there because AI事業者ガイドライン 第1.2版 6)① and the Digital Agency's DS-920 6.5 ask for it in logs; humanInvolvement records how a person takes part; it is useful for the duties in GDPR Art. 22(3) and 13–15, the EU AI Act Art. 26(11) and 86, and the guideline's U-7. Retention is a deployment setting, not a model attribute."
  - ja: answers と corrections は NGSI-LD 1.8 の JsonProperty（中のキーは JSON-LD として展開しない）、humanInvolvement は VocabProperty（値は IRI）。Orion-LD（post-1.12.0、2026-09-25 時点）はこの 2 つの型を受け付けないので、Orion-LD ではこのモデルのエンティティを保存できない。Scorpio 6.0.2、Stellio 2.38.0、GeonicDB は保存できる（2026-10-07 確認）。入力のコピーは持たない。入力に個人情報が入りうるため、refersTo で入力を指す。
    en: "answers and corrections are NGSI-LD 1.8 JsonProperties (their keys are not expanded as JSON-LD), humanInvolvement a VocabProperty (its value is an IRI). Orion-LD (post-1.12.0, as of 2026-09-25) refuses both types, so it cannot store entities of this model; Scorpio 6.0.2, Stellio 2.38.0 and GeonicDB can (checked 2026-10-07). No copy of the input: it can hold personal data, so refersTo points to it."
  - ja: facts は規則の集まりが求めた空間の事実を、判定のために調べた結果。値そのものを残すため JsonProperty にした。PROV-O では判定の入力に当たるが、JsonProperty なので prov:used の関係にはならない（prov:used は refersTo だけ）。正式な PROV-O にするには、事実ごとにエンティティを作って prov:used で結ぶ。source は層とその日付などの ID で、IRI ではない。位置そのものは持たない（refersTo の先にある）。モデルには見せず、規則だけが使う（geolonia/pointsman の docs/spikes/spatial-facts.md）。
    en: "facts are the spatial facts the rule set asks for, as looked up for the decision; a JsonProperty keeps the values themselves. In PROV-O they are inputs of the decision, but as a JsonProperty they make no prov:used link (only refersTo does); full PROV-O would make an entity per fact and link it with prov:used. source is an id such as a layer and its date, not an IRI. The location itself is not stored (it is on the refersTo entity). The model does not see the facts; only the rules use them (docs/spikes/spatial-facts.md in geolonia/pointsman)."
  - ja: プレリリースの下書き。geolonia/pointsman（#16、#51、#52）で作り、まだデータモデルのグループに提案していない。サブジェクト名 decision と名前空間 https://datamodels.jp/ns/decision/ は、実データで使う前にグループの了承が要る。
    en: "Pre-release draft, made in geolonia/pointsman (#16, #51, #52) and not yet proposed to the datamodels group. The subject name decision and the namespace https://datamodels.jp/ns/decision/ need the group's agreement before real data uses them."
