title:
  ja: 判定
  en: Decision
description:
  ja: 1 件のエンティティについての自動判定 1 件。規則の集まりの問いへのモデルの答え（確率付き）と、その結果の行動。
  en: "One automated decision about one entity: a model's answers to the questions of a rule set, with probabilities, and the resulting action."
status: draft
tags: [decision, ai, provenance]
attributes:
  refersTo:
    ja: 判定の対象（入力）のエンティティ。refersTo か externalReference のどちらかが必須
    en: The entity the decision is about (the input). One of refersTo or externalReference is required
  externalReference:
    ja: 対象がブローカーのエンティティでないときの参照（例 Issue の URL）
    en: What the decision is about when it is not an entity in the broker, for example an issue URL
  action:
    ja: 規則が出した行動。次に何が起きるか（例 auto、review、publish、urgent）。値は規則の集まりが定める
    en: The action the rules gave, meaning what happens next (for example auto, review, publish, urgent). The values are defined by the rule set
  answers:
    ja: モデルの答え。問いごとに 1 つ、それぞれ確率付き。各要素は name（問いの名前）、type（noul＝はい・いいえ、choice＝選択肢から 1 つ、score＝順序のある段階）、value、probability（value の確率）、choice と score では probabilities（選択肢・段階ごとの確率）
    en: "The model's answers, one per question, each with its probability. Each item has name (the question), type (noul for yes or no, choice for one of a list of options, score for a level on an ordered scale), value, probability (of that value) and, for choice and score, probabilities (per option or level)"
  profile:
    ja: 問いを出し、答えを行動に変えた規則の集まりの ID（Pointsman ではプロファイル）
    en: Id of the rule set that asked the questions and turned the answers into the action (in Pointsman, the profile)
  profileVersion:
    ja: 規則の集まりの版
    en: Version of the rule set
  policyRule:
    ja: 行動を出した規則。0 から数えた番号を文字列で（"0"、"1" など）、どの規則にも当たらなかったときは "default"。判定の根拠
    en: "Which rule gave the action: its index from 0 as text (\"0\", \"1\", ...), or \"default\" when no rule matched. The reason for the result"
  model:
    ja: 答えたモデルの ID
    en: Id of the model that answered
  decidedAt:
    ja: 判定した日時
    en: When the decision was made
  humanInvolvement:
    ja: "人の関わり方（W3C DPV の語）: dpv:HumanInvolvementForVerification（行動の前に人が確認する）、dpv:HumanInvolvementForOversight（行動はそのまま行い、人が後から確認・修正できる）、dpv:HumanInvolvementForDecision（人が決め、答えは参考）、dpv:HumanNotInvolved（人は関わらない）"
    en: "How a person takes part, as a W3C DPV term: dpv:HumanInvolvementForVerification (a person checks before the action is taken), dpv:HumanInvolvementForOversight (the action is taken, and a person can check and correct it later), dpv:HumanInvolvementForDecision (a person decides, and the answers only inform), dpv:HumanNotInvolved"
  reviewStatus:
    ja: 人による確認の状態。pending（確認待ち）か resolved（確認済み）。確認を求めないときは省く
    en: State of the check by a person, pending or resolved. Absent when no check was asked
  finalAction:
    ja: 人が確認した後の行動
    en: The action after the check by a person
  reviewedBy:
    ja: 確認した人。アカウント、役割、チームの識別子で、個人名は入れない
    en: Who resolved the check, as an account, role or team identifier, not a personal name
  reviewedAt:
    ja: 確認した日時
    en: When the check was resolved
  corrections:
    ja: 人が直した答え（モデルの正しさを測る正解データ）。各要素は name、value、by（識別子）、at、任意で note
    en: Answers corrected by a person (the ground truth for measuring the model). Each item has name, value, by (an identifier), at and optionally note
  wasInformedBy:
    ja: 判定がつながるとき、この判定の前の判定
    en: The decision this one followed, in a chain of decisions
