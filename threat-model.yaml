    parameters:
      - name: due-callbacks
        attacker_controllable: false
        control_kinds: [serialized-state]
        caller_must_enforce: "none — P-CALLBACK-SIGNED"
        provenance: {kind: documented, source: "docs/reviews.md \"Retries are run by the Worker's cron trigger\""}
