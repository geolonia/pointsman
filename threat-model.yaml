build_policy:
  security_relevant_flags_present: true
  provenance: {kind: documented, source: "wrangler.jsonc vars and compatibility_flags; docs/models.md; docs/profile-format.md"}

build_flags:
  - name: PROFILE_SOURCE=bundled
    default: "bundled (dev config); kv (template)"
    security_relevant: true
    maintainer_stance: dev-only
    affects_properties: [{property_id: P-PROFILE-VERSION-IMMUTABLE, effect: voids}]
    provenance: {kind: documented, source: "README \"Development\": \"wrangler.jsonc in this repository is for development only\""}
  - name: MODEL_MODE=mock
    default: "mock (dev config); workers-ai (template)"
    security_relevant: true
    maintainer_stance: dev-only
    affects_properties: [{property_id: P-ACTION-FROM-POLICY, effect: narrows}]
    provenance: {kind: documented, source: "docs/models.md \"MODEL_MODE\" table: \"development and tests\""}
  - name: engine-json-modules
    default: "unset: every module in this repository"
    security_relevant: true
    maintainer_stance: supported
    affects_properties: [{property_id: P-FACTS-NEVER-GUESSED, effect: preserves}]
    provenance: {kind: documented, source: "docs/modules.md \"Choosing modules\""}
  - name: FACTS_MODE
    default: "off"
    security_relevant: true
    maintainer_stance: supported
    affects_properties: [{property_id: P-FACTS-NEVER-GUESSED, effect: preserves}]
    provenance: {kind: documented, source: "docs/profile-format.md \"Fact providers\" table"}
  - name: FACTS_GITHUB
    default: "off"
    security_relevant: true
    maintainer_stance: supported
    affects_properties: [{property_id: P-GITHUB-READ-ONLY, effect: preserves}, {property_id: P-FACTS-NEVER-GUESSED, effect: preserves}]
