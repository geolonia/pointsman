properties_claimed:
  - id: P-AUTH-REQUIRED
    kind: authentication
    components: [engine-api, engine-mcp]
    tier: security-critical
    conditions: "every /v1/* and /mcp request; a valid API token or, on /mcp, a valid OAuth access token"
    violation_symptoms: [x-authentication-bypass]
    provenance: {kind: documented, source: "README \"API tokens\": \"Every request needs Authorization: Bearer <token>\""}
  - id: P-TOKEN-SCOPE
    kind: x-authorization
    components: [engine-api, engine-mcp]
    tier: security-critical
    conditions: "a token with a profile list; scope checked before the profile lookup; also for required decisions, which are hidden as {decision: null} outside the scope; voided by --profiles '*' tokens and OAuth people"
    violation_symptoms: [x-authorization-bypass, info-leak]
    provenance: {kind: documented, source: "docs/decision-log.md \"A token sees and corrects only decisions of profiles in its scope\""}
  - id: P-TOKEN-HASHED
    kind: confidentiality
    components: [engine-api, engine-mcp, config-repo]
    tier: security-critical
    conditions: "tokens created by scripts/tokens.mjs: 32 random bytes, SHA-256 stored, printed once"
    violation_symptoms: [info-leak]
    provenance: {kind: documented, source: "README \"API tokens\": \"Only a SHA-256 hash of each token is stored\""}
  - id: P-TEST-TOKEN-ISOLATED
    kind: integrity
    components: [engine-api, engine-mcp, engine-callbacks]
    tier: security-critical
    conditions: "a token record with test: true; it cannot send decisions or decide a profile with requires"
    violation_symptoms: [x-unlogged-decision-acted-on, info-leak]
    provenance: {kind: documented, source: "README \"API tokens\": \"A test token may only decide (and list its profiles) over the REST API, not over MCP, and gets no callbacks\""}
  - id: P-ANSWER-SHAPE
    kind: output-sanitization
    components: [engine-api, engine-mcp, bridge]
    tier: security-critical
    conditions: "every model answer, every adapter; anything that does not fit the profile is model_error"
    violation_symptoms: [bad-data-accepted]
    provenance: {kind: documented, source: "docs/profile-format.md \"Engine answer format\": \"Answers that do not fit the profile ... are rejected with a model_error\""}
  - id: P-ACTION-FROM-POLICY
    kind: integrity
    components: [engine-api, engine-mcp]
    tier: security-critical
    conditions: "the first true rule over typed answers, facts and required decisions, else the default; unknown comparisons never match"
    violation_symptoms: [x-unauthorized-action]
    provenance: {kind: documented, source: "README \"People's rules decide ... The AI does not decide alone\""}
  - id: P-CHAIN-INPUTS-FROM-LOG
    kind: x-authorization
    components: [engine-api, engine-mcp]
    tier: security-critical
    conditions: "a profile with requires; only decision ids are taken; each must be logged, of the named profile, in scope, with the same ref and client, not replaced; every other id gives the same 400"
    violation_symptoms: [x-authorization-bypass, x-unauthorized-action, info-leak]
    provenance: {kind: documented, source: "docs/profile-format.md \"Decision chains\": \"Pointsman reads them from the decision log; the caller cannot claim a result\""}
  - id: P-POLICY-NOT-CODE
    kind: memory-safety
    components: [engine-api, config-repo]
    tier: security-critical
    conditions: "profile conditions parsed and evaluated as data; compiled at validation time"
    violation_symptoms: [x-code-execution]
    provenance: {kind: documented, source: "docs/profile-format.md \"The engine evaluates conditions with its own parser; nothing is run as code\""}
  - id: P-FACTS-NEVER-GUESSED
    kind: integrity
    components: [engine-facts]
    tier: security-critical
    conditions: "a failed lookup is missing with a reason; unknown comparisons never match; legend or shape errors fail closed; GitHub shape errors, redirects, rate limits and too many files or checks are error, another head is stale; unreadable CODEOWNERS or teams or patterns the engine does not read make the whole github_pr fact missing; unlisted pushes make pushed_by_author unavailable; the model never sees facts"
    violation_symptoms: [bad-data-accepted, wrong-output]
    provenance: {kind: documented, source: "docs/profile-format.md \"A missing fact is never guessed\""}
  - id: P-FACT-LOOKUP-BOUNDED
    kind: resource-bound
    components: [engine-facts]
    tier: correctness-only
    conditions: "≤1000 positions, ≤200 samples, ≤16 flood tiles, ≤9 shelter tiles, ≤5 km detour, 3 s per fact (8 s and ≤ 6 routing calls per detour), 10 s per tile load; GitHub: 5 s per decision, ≤1000 files, ≤250 commits, ≤300 check runs, ≤100 statuses and workflow runs, ≤5 pages of 100 activity entries, globs without regular expressions; CODEOWNERS ≤128 KiB, patterns ≤1024 characters, comments removed in one pass, ≤50 million matching steps per decision; exceeding is error or timeout"
    violation_symptoms: [hang, unbounded-allocation]
    provenance: {kind: documented, source: "docs/profile-format.md \"One snapshot\"; maintainer ruling 2026-10"}
  - id: P-DECISION-LOGGED-FIRST
    kind: integrity
    components: [engine-api, engine-mcp]
    tier: security-critical
    conditions: "every decision with a normal token; voided by test tokens by design"
    violation_symptoms: [x-unlogged-decision, integrity-bypass]
    provenance: {kind: documented, source: "docs/decision-log.md \"Every decision is stored in D1 ... before it is returned\""}
  - id: P-PROFILE-VERSION-IMMUTABLE
    kind: integrity
    components: [config-repo, engine-api]
    tier: security-critical
    conditions: "profiles published through the template's Deploy workflow; D1 registration of content hashes; the engine pinned by commit"
    violation_symptoms: [integrity-bypass]
    provenance: {kind: documented, source: "docs/deployment.md \"Profile versions\": \"A published version never changes\""}
  - id: P-STATE-NOT-STORED
    kind: confidentiality
    components: [engine-api, engine-mcp]
    tier: security-critical
    conditions: "default profile settings; voided by log.store_state and AI Gateway collect_logs; narrowed by route: true on a detour fact (the place is kept)"
    violation_symptoms: [info-leak]
    provenance: {kind: documented, source: "docs/decision-log.md \"By default only the hash of the state is kept\""}
  - id: P-SECRETS-NOT-LOGGED
    kind: confidentiality
    components: [engine-api, engine-facts, engine-callbacks, engine-mcp]
    tier: security-critical
    conditions: "the engine's own logs, errors and responses, including the GitHub fact token, GitHub App key and installation tokens; outbound calls with keys or tokens refuse redirects"
    violation_symptoms: [info-leak]
    provenance: {kind: documented, source: "docs/models.md \"Errors and logs never include ... the key\"; docs/profile-format.md \"Settings\": \"The token and the key are never logged\""}
  - id: P-REVIEW-RESOLVED-ONCE
    kind: correctness
    components: [engine-api]
    tier: correctness-only
    conditions: "a pending review; concurrent or repeated resolves answer 409; a superseded review cannot be resolved"
    violation_symptoms: [data-race, x-double-resolution]
    provenance: {kind: documented, source: "docs/reviews.md \"A review can be resolved once\""}
  - id: P-CALLBACK-SIGNED
    kind: integrity
    components: [engine-callbacks]
    tier: security-critical
    conditions: "CALLBACK_SECRET set; every attempt signed and timestamped; claimed before sending; at most 6 attempts"
    violation_symptoms: [integrity-bypass]
    provenance: {kind: documented, source: "docs/reviews.md \"Every callback is signed with the Worker secret CALLBACK_SECRET\""}
  - id: P-GITHUB-READ-ONLY
    kind: integrity
    components: [engine-facts]
    tier: security-critical
    conditions: "GET requests to the fixed host api.github.com and, with a GitHub App, one POST that creates an installation token; no write to a repository, pull request or check; redirects not followed; source names only the pull request"
    violation_symptoms: [x-unauthorized-write, info-leak]
    provenance: {kind: documented, source: "src/facts-github.ts header: \"this file only sends GET requests to the GitHub API\"; docs/profile-format.md \"Settings\""}
  - id: P-GITHUB-FACTS-FOR-HEAD
    kind: integrity
    components: [engine-facts]
    tier: security-critical
    conditions: "one snapshot per decision checked against the requested head; another head makes every GitHub fact stale; a push while the file list is read makes the facts that use it stale; github_checks is read by the head commit id; a malformed pull request reference is no_pr and nothing is sent"
    violation_symptoms: [x-toctou, wrong-output]
    provenance: {kind: documented, source: "docs/profile-format.md \"GitHub pull requests\"; \"One snapshot\""}
  - id: P-GITHUB-REQUIRED-CHECKS
    kind: integrity
    components: [engine-facts]
    tier: security-critical
    conditions: "only the base branch's required checks and ruleset-required workflows on the head; app-tied checks only from that app; required workflows only through GitHub's run for the ruleset; disagreeing results give the stricter one; no required checks is not green; only FACTS_GITHUB_IGNORE_CHECK is left out"
    violation_symptoms: [x-check-bypass, wrong-output]
    provenance: {kind: documented, source: "docs/profile-format.md \"One snapshot\": \"A workflow that a ruleset requires counts only through a run that GitHub started for the ruleset\""}
  - id: P-OUTBOUND-PUBLIC-ONLY
    kind: x-ssrf-resistance
    components: [engine-api, engine-facts, engine-callbacks, engine-mcp, bridge]
    tier: security-critical
    conditions: "global_fetch_strictly_public present in the deployment's compatibility_flags"
    violation_symptoms: [x-ssrf]
    provenance: {kind: documented, source: "wrangler.jsonc comment: \"Outgoing fetches (review callbacks, OAuth client metadata) reach only public addresses\""}
  - id: P-MCP-VISIBILITY
    kind: x-authorization
    components: [engine-mcp]
    tier: security-critical
    conditions: "profiles with mcp.visible: true in the caller's scope; others look unknown; get_decision strips callback_url and state"
    violation_symptoms: [x-authorization-bypass, info-leak]
    provenance: {kind: documented, source: "docs/mcp.md \"Only profiles that set mcp.visible: true are listed or callable through MCP\""}
  - id: P-OAUTH-ORG-MEMBERSHIP
    kind: authentication
    components: [engine-mcp]
    tier: security-critical
    conditions: "GitHub login configured; active membership checked at login; 1 h access tokens, 7 day grants; partial configuration refuses every request"
    violation_symptoms: [x-authentication-bypass]
    provenance: {kind: documented, source: "docs/mcp.md \"Only active members of the allowed GitHub organizations get in\""}
  - id: P-BRIDGE-NOTIFY-SECRET
    kind: authentication
    components: [bridge]
    tier: security-critical
    conditions: "x-bridge-secret equals NOTIFY_SECRET, compared in constant time; only /notify and /reviews exist"
    violation_symptoms: [x-authentication-bypass]
    provenance: {kind: documented, source: "bridge/README.md \"Configuration\": \"other notifications are refused\""}
  - id: P-BRIDGE-LOOP-GUARD
    kind: correctness
    components: [bridge]
    tier: correctness-only
    conditions: "the subscription delivers the result attribute; attribute-level PATCH; for routes with requires the hash covers the earlier decision ids; routes reading each other's results in a circle refused"
    violation_symptoms: [x-decision-loop]
    provenance: {kind: documented, source: "bridge/README.md \"How it avoids loops\""}
  - id: P-BRIDGE-SAFE-TO-REPEAT
    kind: correctness
    components: [bridge]
    tier: correctness-only
    conditions: "a notification handled twice; a review already resolved; feedback already sent; an Idempotency-Key per route, entity and request; routes with requires from the queue only, no older result written"
    violation_symptoms: [wrong-output]
    provenance: {kind: documented, source: "bridge/README.md \"Safe to repeat\""}
  - id: P-TRIAGE-ALLOWLIST
    kind: output-sanitization
    components: [action-triage]
    tier: security-critical
    conditions: "labels only from the allow-list and only for action auto; issue text never in a shell or the summary"
    violation_symptoms: [x-command-injection, x-unlisted-label]
    provenance: {kind: documented, source: "actions/triage/README.md \"Only labels you list in labels are ever applied\""}
  - id: P-WATCH-FAILSAFE
    kind: availability
    components: [action-deploy-watch]
    tier: correctness-only
    conditions: "consecutive cancel answers while quiet; an unreachable Pointsman never cancels"
    violation_symptoms: [x-unwarranted-cancel]
    provenance: {kind: documented, source: "actions/deploy-watch/README.md \"Cancel only when sure\""}

