    tier: correctness-only
    false_friend: false
    provenance: {kind: documented, source: "docs/profile-format.md \"CodeRabbit reviews\""}
  - id: D-LOG-FACTS-NOT-ATOMIC
    components: [engine-facts]
    conditions: "a log read is not a snapshot; two decisions at the same moment can miss each other, so a queue or spend limit can be passed; basis: stated; correctness only by a maintainer ruling (2026-10-24, Q35)"
    tier: correctness-only
    false_friend: true
    provenance: {kind: maintainer, date: "2026-10"}
  - id: D-CONNECTOR-SHOWS-DECISION
    components: [connector-github]
    conditions: "every check run and the decision comment show the action, rule, facts' state and the AI answers' values to everyone who may read the pull request"
    tier: security-critical
    false_friend: false
    provenance: {kind: maintainer, date: "2026-10"}
  - id: D-CONNECTOR-OWN-REVIEW-EVENTS
    components: [connector-github]
    conditions: "since pointsman#216 (v0.15.0) events about its own approvals and dismissals, sent by its own bot, start no run; one that arrives before the approving run recorded the review, one about a review older than the newest 50, or one while its bot's login cannot be read still starts one more run; a person's or another app's dismissal always does; a profile that depends on its own approval without keep_approval can approve and withdraw in turn on runs other events start; basis: a maintainer ruling (2026-10-24, Q33), narrowed by pointsman#216"
    tier: correctness-only
    false_friend: false
    provenance: {kind: documented, source: "docs/github-connector.md \"How it works\", 1"}
  - id: D-EXACTLY-ONCE
    components: [engine-callbacks]
    conditions: "a callback can arrive more than once when a 2xx is lost; basis: stated"
    tier: correctness-only
    false_friend: false
    provenance: {kind: documented, source: "docs/reviews.md \"A callback can arrive more than once if your 2xx answer is lost\""}
  - id: D-BRIDGE-BROKER-ACCESS-CONTROL
    components: [bridge]
    conditions: "whoever may write entities, Decision or completed Task entities in the tenant can trigger decisions, resolve reviews and name reviewedBy; the broker's access control owns this; basis: stated"
    tier: security-critical
    false_friend: false
    provenance: {kind: documented, source: "bridge/README.md \"Who may resolve is decided by the broker's access control\""}
  - id: D-BRIDGE-RACE-WINDOWS
    components: [bridge]
    conditions: "NGSI-LD has no conditional update; a newer decision can be overwritten by an older result; two simultaneous notifications can send the same feedback twice; basis: stated"
    tier: correctness-only
    false_friend: false
    provenance: {kind: documented, source: "bridge/README.md \"NGSI-LD has no conditional update, so there is a short window\""}
  - id: D-BRIDGE-DELIVERY
    components: [bridge]
    conditions: "retry of a failed notification depends on the broker; without a queue a lost notification leaves a review or work order open; basis: stated"
    tier: correctness-only
    false_friend: false
    provenance: {kind: documented, source: "bridge/README.md \"Whether a broker sends a failed notification again depends on the broker\""}

downstream_responsibilities:
  - id: R-PRIVATE-CONFIG
    component: config-repo
    statement: "keep the config repository private, protect main, require the Validate check, keep global_fetch_strictly_public"
    enforces: [protect-config-main, P-OUTBOUND-PUBLIC-ONLY]
    provenance: {kind: documented, source: "template/config-repo/README.md \"Protect main\""}
  - id: R-SCOPED-TOKENS
    component: config-repo
    statement: "one token per client limited to its profiles; --profiles '*' only for administration; store as a secret; revoke on a leak"
    enforces: [scoped-tokens, operator-only-token-writes]
    provenance: {kind: documented, source: "README \"API tokens\": \"Each client gets its own token, which can be limited to some profiles\""}
  - id: R-RATE-LIMIT
    component: engine-api
    statement: "rate-limit and budget at the edge and in the AI Gateway; the engine does not"
    enforces: [rate-limit-at-edge]
    provenance: {kind: maintainer, date: "2026-10"}
  - id: R-REVIEW-PATH
    component: engine-api
    statement: "route review decisions to people; choose thresholds with a margin; re-check examples after a model update; never make a consequential action the policy's default"
    enforces: [final-action-is-acted-on, action-is-right]
    provenance: {kind: documented, source: "docs/fiware-demo.md \"Lesson: keep a margin from the thresholds\""}
  - id: R-IGNORE-TEST-DECISIONS
    component: engine-api
    statement: "never act on a decision marked test: true; keep test tokens out of production clients"
    enforces: [test-decision-is-logged]
    provenance: {kind: documented, source: "README \"API tokens\": \"nobody acts on them\""}
  - id: R-VERIFY-CALLBACK
    component: engine-callbacks
    statement: "verify x-pointsman-signature with CALLBACK_SECRET, reject old timestamps, make the handler idempotent on decision_id"
    enforces: [callback-authentic-unchecked, callback-exactly-once]
    provenance: {kind: documented, source: "docs/reviews.md \"Check the signature, and reject old timestamps\""}
  - id: R-STATE-IS-DATA
    component: engine-api
    statement: "treat state as untrusted data in every client; never build a shell command, query or template from it; keep secrets out of ref"
    enforces: [treat-state-as-data, ref-no-secrets]
    provenance: {kind: documented, source: "actions/triage/README.md; openapi.yaml ref"}
  - id: R-DATA-MINIMISATION
    component: engine-api
    statement: "no secrets in state; personal data only when collect_logs and log.store_state are what you intend; set collect_logs: false when inputs must not be kept; route: true on a detour fact only where the place may be kept"
    enforces: [backend-keeps-nothing, P-STATE-NOT-STORED]
    provenance: {kind: documented, source: "docs/models.md \"Logs hold the state\""}
  - id: R-CALLBACK-SECRET
    component: engine-callbacks
    statement: "set CALLBACK_SECRET before clients use callback_url; without it no callback is sent"
    enforces: [callback-url-https-public, P-CALLBACK-SIGNED]
    provenance: {kind: documented, source: "docs/deployment.md \"Set the callback secret\""}
  - id: R-OAUTH-SETUP
    component: engine-mcp
    statement: "a GitHub App with only Organization → Members: Read-only installed on every allowed organization; all five settings or none; accept the 7-day lag or clear OAUTH_KV"
    enforces: [P-OAUTH-ORG-MEMBERSHIP]
    provenance: {kind: documented, source: "docs/mcp.md \"Setting up GitHub login\""}
  - id: R-MCP-VISIBLE
    component: engine-mcp
    statement: "set mcp.visible: true only on profiles every member of the allowed organizations may use"
    enforces: [P-MCP-VISIBILITY]
    provenance: {kind: documented, source: "docs/mcp.md \"People may use every MCP-visible profile\""}
  - id: R-REVIEWER-ATTRIBUTION
    component: engine-api
    statement: "if who resolved a review matters, authenticate the person in the client and put an account identifier, not a free name, in by"
    enforces: [reviewer-attribution, by-is-verified]
    provenance: {kind: documented, source: "bridge/README.md \"reviewedBy (an account or role, not a personal name)\""}
  - id: R-BRIDGE-SUBSCRIPTION
    component: bridge
    statement: "a strong NOTIFY_SECRET in receiverInfo; a token limited to the bridge's profiles; broker access control for writers; the result attribute included in notifications; max_concurrency 1 with a queue; one bridge per tenant"
    enforces: [bridge-config, broker-access-control, P-BRIDGE-LOOP-GUARD]
    provenance: {kind: documented, source: "bridge/README.md \"Configuration\", \"How it avoids loops\", \"Reliable delivery (queue)\""}
  - id: R-ACTION-INPUTS
    component: action-triage
    statement: "pin by full commit SHA; set run, stacks and labels in the workflow, never from event data; minimal job permissions; the token as a secret"
    enforces: [action-inputs-from-workflow]
    provenance: {kind: documented, source: "actions/triage/README.md \"Example workflow\"; actions/deploy-watch/action.yml run"}
  - id: R-GITHUB-CREDENTIAL
    component: engine-facts
    statement: "a fine-grained token or GitHub App with only the documented read permissions, stored as a Worker secret, replaced on a leak; FACTS_GITHUB_IGNORE_CHECK set to the deployment's own Pointsman check"
    enforces: [P-GITHUB-READ-ONLY, P-SECRETS-NOT-LOGGED]
    provenance: {kind: documented, source: "docs/profile-format.md \"Settings\": \"Give the app read permissions only\""}
  - id: R-GITHUB-REPOSITORIES
    component: engine-facts
    statement: "give the GitHub credential only the repositories whose pull requests the deployment decides about"
    enforces: [github-credential-reach]
    provenance: {kind: maintainer, date: "2026-10"}
  - id: R-GITHUB-RULES
    component: engine-facts
    statement: "where a pull-request author must not pass a required check by naming a job, require checks as ruleset workflows or tie each to its app and limit who may change workflows"
    enforces: [P-GITHUB-REQUIRED-CHECKS]
    provenance: {kind: maintainer, date: "2026-10"}
  - id: R-GITHUB-ACT-ON-HEAD
    component: engine-facts
    statement: "act on a decision with GitHub facts only for the head commit the request named; decide again after a new push; treat stale like any missing fact"
    enforces: [P-GITHUB-FACTS-FOR-HEAD]
    provenance: {kind: documented, source: "docs/profile-format.md \"GitHub pull requests\": \"head is the commit the client saw\""}
  - id: R-GITHUB-POSITIVE-RULES
    component: engine-facts
    statement: "in rules that allow something, check for missing facts first and write every condition as a known, positive value"
    enforces: [github-rules-known-positive]
    provenance: {kind: documented, source: "docs/profile-format.md \"GitHub pull requests\", \"Safety\""}
  - id: R-GITHUB-BUMP-PAIR
    component: engine-facts
    statement: "pair github_bump with github_pr, check missing first, require registry_changed false and a release_age_days margin; an old-enough release is not a reviewed one"
    enforces: [github-rules-known-positive, P-FACTS-NEVER-GUESSED]
    provenance: {kind: documented, source: "docs/profile-format.md github_bump row: \"pair it with github_pr\""}
  - id: R-INTERNAL-CALL
    component: engine-api
    statement: "keep Workers deploy permission to the people who deploy the engine; INTERNAL_CLIENT lists only the connector's profiles under its token's client name; revoke the old token; remove the setting to switch off; no reliance on edge rules"
    enforces: [internal-account-deploy, internal-client-profiles, P-INTERNAL-CLIENT-FROM-ENGINE]
    provenance: {kind: documented, source: "docs/adapters.md \"Internal calls\"; docs/github-connector.md \"Internal call\""}
  - id: R-CONNECTOR-APPS
    component: connector-github
    statement: "two GitHub Apps, the connector app only in the connector Worker; install only on the connector's repositories; only the permissions its settings need; secrets only in wrangler; its own token, never a test token"
    enforces: [connector-apps-setup, P-CONNECTOR-TOKEN-SCOPED]
    provenance: {kind: documented, source: "docs/github-connector.md \"The two GitHub apps\"; \"Setting it up\""}
  - id: R-CONNECTOR-APPROVE
    component: connector-github
    statement: "before mapping approve: dismiss stale approvals in the ruleset; keep code-owner reviews where required; map approve only from profiles with positive rules that require the facts; AI answers may add conditions, never be the basis; keep_approval only for an action of its own from a rule that requires what the approving rule requires; approve and keep_approval with once_per_head are refused by the settings since pointsman#216 (v0.15.0)"
    enforces: [P-CONNECTOR-APPROVE-HEAD, github-rules-known-positive]
    provenance: {kind: documented, source: "docs/github-connector.md \"Actions\": \"Required\"; \"Code owners\""}
  - id: R-CONNECTOR-ANSWERS
    component: connector-github
    statement: "list people_answers in every profile the connector asks a person about; offer only answers a person's yes may lead to; switch answers on only where every writer may approve; keep the ruleset's stale-approval and most-recent-push rules and code-owner reviews; the app's Contents read and Check run event, Issues read and Issue comment event only for the command; give other clients the connector's profiles only if they may answer; deploy the engine first"
    enforces: [connector-answers-setup, P-CONNECTOR-ANSWER-AUTHORIZED, D-RESOLVE-BY-SCOPE]
    provenance: {kind: documented, source: "docs/github-connector.md \"Asking a person\", \"Switching it on\""}
  - id: R-CONNECTOR-COPILOT
    component: connector-github
    statement: "map copilot_review only where the organization allows Copilot code review for every repository in repos; limit reviews with skip_drafts and a rule on github_copilot; keep a Copilot budget in the organization; check the first request when switching it on"
    enforces: [D-CONNECTOR-COPILOT-COST, D-CONNECTOR-COPILOT-DATA]
    provenance: {kind: documented, source: "docs/github-connector.md \"Copilot reviews\""}
  - id: R-APP-APPROVAL-BOT
    component: engine-facts
    statement: "set bot_id in a github_app_approval fact"
    enforces: [P-SERVICE-ACCOUNT-ONLY]
    provenance: {kind: documented, source: "docs/profile-format.md \"GitHub pull requests\" settings table, bot_id"}
  - id: R-WORKFLOWS-TO-PERSON
    component: engine-facts
    statement: "send privileged, unparsed and local_unresolved workflow changes to a person; never approve on zero counts alone"
    enforces: [D-WORKFLOWS-BEST-EFFORT]
    provenance: {kind: documented, source: "docs/profile-format.md \"GitHub workflows\""}
  - id: R-RELEASE-PAIR
    component: engine-facts
    statement: "pair github_release with github_pr; name exact version and changelog files; no files that run in version_text_files"
    enforces: [D-RELEASE-NOT-WHO]
    provenance: {kind: documented, source: "docs/profile-format.md github_release row"}
  - id: R-CONNECTOR-PUBLIC-DECISIONS
    component: connector-github
    statement: "accept that check runs and the comment show decisions and AI answers to the pull request's readers, or do not ask that profile there"
    enforces: [D-CONNECTOR-SHOWS-DECISION]
    provenance: {kind: maintainer, date: "2026-10"}
  - id: R-CONNECTORS-IN-ENGINE
    component: engine-api
    statement: "choose connectors for the engine Worker only after review; their own token, never a test token; their secrets as engine Worker secrets; edge limits on /connectors/; write keys only in an own Worker"
    enforces: [P-CONNECTORS-IN-ENGINE-API-ONLY, connectors-in-engine-review]
    provenance: {kind: documented, source: "docs/connectors.md \"Where it runs\", \"Trust\""}
  - id: R-DEPLOY-TOOLING
    component: config-repo
    statement: "run tokens.mjs with --remote only on purpose and keep the printed token out of history and logs; deploy only through the template's workflows"
    enforces: [deploy-through-template, engine-repository-fixed, validate-and-version-profiles]
    provenance: {kind: documented, source: "README \"API tokens\"; docs/deployment.md"}

known_misuses:
  - id: acting-on-test-decisions
    components: [engine-api, engine-mcp]
    pattern: "acting on a test: true decision as if it were logged"
    safer_alternative: "check the test field; keep test tokens out of production clients"
    provenance: {kind: documented, source: "README \"API tokens\": \"nobody acts on them\""}
  - id: p-as-accuracy
    components: [engine-api, engine-mcp, bridge, action-triage, action-deploy-watch]
    pattern: "reading p as the model's accuracy and setting thresholds without a margin"
    safer_alternative: "treat p as the model's probability; keep a margin; re-check examples after model updates"
    provenance: {kind: documented, source: "docs/fiware-demo.md \"Lesson: keep a margin from the thresholds\""}
  - id: log-as-proof
    components: [engine-api]
    pattern: "citing the decision log as proof that a report was true or that a named person resolved it"
    safer_alternative: "treat the log as the engine's record; authenticate people in the client"
    provenance: {kind: documented, source: "docs/decision-log.md \"What is stored\""}
  - id: wildcard-token-everywhere
    components: [engine-api, config-repo]
    pattern: "one --profiles '*' token shared by every client"
    safer_alternative: "one scoped token per client"
    provenance: {kind: documented, source: "README \"API tokens\""}
  - id: run-from-event-data
    components: [action-deploy-watch]
    pattern: "building deploy-watch's run or stacks from issue or pull-request text"
    safer_alternative: "set them in the workflow only"
    provenance: {kind: documented, source: "actions/deploy-watch/action.yml run"}
  - id: unverified-callback
    components: [engine-callbacks]
    pattern: "a callback receiver that acts without checking the signature and timestamp, or that is not idempotent"
    safer_alternative: "verify the HMAC and timestamp; dedupe on decision_id"
    provenance: {kind: documented, source: "docs/reviews.md \"Check the signature, and reject old timestamps\""}
  - id: subscription-without-result-attribute
    components: [bridge]
    pattern: "a subscription that limits notification.attributes to the inputs so the result attribute never arrives and every notification decides again"
    safer_alternative: "leave notification.attributes unset or include the result attribute"
    provenance: {kind: documented, source: "bridge/README.md \"How it avoids loops\""}
  - id: mcp-visible-on-sensitive-profile
    components: [engine-mcp]
    pattern: "mcp.visible: true on a profile whose questions or decisions are not for every organization member"
    safer_alternative: "keep such profiles token-only"
    provenance: {kind: documented, source: "docs/mcp.md \"People may use every MCP-visible profile\""}
  - id: secrets-in-ref
    components: [engine-api, engine-mcp]
    pattern: "putting secrets or identifying free text into ref"
    safer_alternative: "use an opaque reference such as an issue URL"
    provenance: {kind: documented, source: "openapi.yaml DecideRequest.ref"}
  - id: personal-data-with-gateway-logs
    components: [engine-api]
    pattern: "sending personal data in state with the AI Gateway's logs on and no retention decision"
    safer_alternative: "set collect_logs: false or decide retention first"
    provenance: {kind: documented, source: "docs/models.md \"Logs hold the state\""}
  - id: consequential-default-action
    components: [engine-api, config-repo]
    pattern: "making a consequential action the policy's default so a missing fact or a steered answer falls through to it"
    safer_alternative: "default to review"
    provenance: {kind: documented, source: "docs/profile-format.md \"Policy conditions\""}
  - id: github-credential-with-write
    components: [engine-facts]
    pattern: "giving the GitHub fact credential write permissions, or a classic token that reaches every repository of its owner"
    safer_alternative: "a fine-grained token or GitHub App with read permissions on the repositories the deployment decides about"
    provenance: {kind: documented, source: "docs/profile-format.md \"Settings\": \"Give the app read permissions only\""}
  - id: allowing-rule-on-missing-github-facts
    components: [engine-facts, config-repo]
    pattern: "an allowing rule that counts on an earlier blocking rule while GitHub facts can be missing, or a glob such as *.md meant to cover every folder"
    safer_alternative: "check missing facts first; write allowing conditions as known positive values; use **/*.md for every folder"
    provenance: {kind: documented, source: "docs/profile-format.md \"GitHub pull requests\", \"Safety\""}
  - id: green-as-intended-jobs
    components: [engine-facts]
    pattern: "reading github_checks.green as proof that the intended jobs ran when required checks are matched by name only"
    safer_alternative: "require checks as ruleset workflows or tie them to their app"
    provenance: {kind: maintainer, date: "2026-10"}
  - id: sole-code-owner-without-protected-codeowners
    components: [engine-facts]
    pattern: "using author_sole_code_owner to skip a review while CODEOWNERS itself is not protected on the base branch"
    safer_alternative: "protect CODEOWNERS on the base branch, for example with a code-owner review for changes to it"
    provenance: {kind: documented, source: "docs/profile-format.md \"GitHub pull requests\" table: \"by the CODEOWNERS file of the base branch\""}
  - id: acting-on-later-push
    components: [engine-facts]
    pattern: "acting on a decision for a later push of the same pull request"
    safer_alternative: "act only for the head commit the request named; decide again after a push"
    provenance: {kind: documented, source: "docs/profile-format.md \"GitHub pull requests\": \"head is the commit the client saw\""}
  - id: approve-without-stale-dismissal
    components: [connector-github]
    pattern: "mapping approve on a branch whose ruleset does not dismiss stale approvals"
    safer_alternative: "turn on dismissal of stale approvals before mapping approve"
    provenance: {kind: documented, source: "docs/github-connector.md \"Actions\": \"Required\""}
  - id: approve-on-ai-answers
    components: [connector-github]
    pattern: "mapping approve from a profile whose allowing rule rests on AI answers about the title, description or diff"
    safer_alternative: "approve only on facts, with positive rules"
    provenance: {kind: maintainer, date: "2026-10"}
  - id: bump-without-author-facts
    components: [engine-facts]
    pattern: "approving a dependency bump on github_bump alone, or with release_age_days 0"
    safer_alternative: "pair with github_pr and an age margin"
    provenance: {kind: documented, source: "docs/profile-format.md github_bump row: \"pair it with github_pr\""}
  - id: test-token-for-connector
    components: [connector-github]
    pattern: "giving the GitHub connector a test token, so it acts on decisions that are not logged"
    safer_alternative: "its own normal token limited to its profiles, or the internal call"
    provenance: {kind: maintainer, date: "2026-10"}
  - id: one-app-for-facts-and-connector
    components: [connector-github, engine-facts]
    pattern: "one GitHub App for the facts and the connector, so the Worker that sends pull-request text to a model holds a key that can write"
    safer_alternative: "two apps: read-only facts app, connector app only in the connector Worker"
    provenance: {kind: documented, source: "docs/github-connector.md \"The two GitHub apps\""}
  - id: internal-client-too-wide
    components: [engine-api]
    pattern: "INTERNAL_CLIENT with more profiles than the connector uses, or another client's name"
    safer_alternative: "only the connector's profiles, under the client name of its token"
    provenance: {kind: documented, source: "docs/github-connector.md \"Internal call\""}
  - id: edge-rules-for-internal-calls
    components: [engine-api, connector-github]
    pattern: "counting on a firewall or rate-limit rule on /v1/ to limit the connector after switching to internal calls"
    safer_alternative: "internal calls do not pass the edge; limit who can deploy Workers instead"
    provenance: {kind: documented, source: "docs/adapters.md \"Internal calls\""}
  - id: keep-approval-too-wide
    components: [connector-github]
    pattern: "keep_approval mapped to an action the profile also gives where the approval should not stand, or from a rule that does not require what the approving rule requires"
    safer_alternative: "an action of its own for the already-approved rule, after every blocking rule"
    provenance: {kind: documented, source: "docs/github-connector.md \"When the approval stays\""}
  - id: approval-depends-on-own-approval
    components: [connector-github]
    pattern: "an approving decision that changes because of the connector's own approval, without keep_approval: it approves and withdraws in turn on the runs other events start"
    safer_alternative: "github_app_approval with a keep_approval rule"
    provenance: {kind: maintainer, date: "2026-10"}
  - id: coderabbit-fact-renamed
    components: [engine-facts]
    pattern: "renaming a profile's coderabbit_budget, coderabbit_queue or coderabbit_spend fact while its earlier decisions are still in the window: taken_by_other_pr, the queue's history and the spend are read by fact name and start from nothing"
    safer_alternative: "keep the fact names, or rename only once the window has passed"
    provenance: {kind: documented, source: "docs/modules.md \"Facts from the decision log\""}
  - id: app-approval-without-bot-id
    components: [engine-facts]
    pattern: "github_app_approval without bot_id"
    safer_alternative: "set bot_id"
    provenance: {kind: documented, source: "docs/profile-format.md \"GitHub pull requests\" settings table, bot_id"}
  - id: workflows-zero-counts-approve
    components: [engine-facts]
    pattern: "approving a workflow change because every github_workflows count is zero"
    safer_alternative: "send privileged changes to a person"
    provenance: {kind: documented, source: "docs/profile-format.md \"GitHub workflows\""}
  - id: release-alone
    components: [engine-facts]
    pattern: "approving on github_release.version_only alone, or files that run in version_text_files"
    safer_alternative: "pair with github_pr; exact files"
    provenance: {kind: documented, source: "docs/profile-format.md github_release row"}
  - id: spend-as-hard-cap
    components: [engine-facts]
    pattern: "treating coderabbit_spend as a hard cap with concurrent decisions"
    safer_alternative: "set the hard limit at CodeRabbit"
    provenance: {kind: documented, source: "docs/modules.md \"Facts from the decision log\""}
  - id: display-fields-as-markup
    components: [engine-api, engine-facts]
    pattern: "showing github_workflows.detail or a CodeRabbit fact's author as Markdown or HTML without escaping"
    safer_alternative: "escape fact values for the grammar they go into"
    provenance: {kind: documented, source: "docs/profile-format.md \"GitHub workflows\", detail"}
  - id: connector-answers-assumed-hidden
    components: [connector-github]
    pattern: "using the connector with AI questions on a public repository while counting on the author not seeing the answers"
    safer_alternative: "accept it or do not ask that profile there"
    provenance: {kind: maintainer, date: "2026-10"}
  - id: answers-where-not-every-writer-may-approve
    components: [connector-github]
    pattern: "switching answers on where not every writer may approve, or without the most-recent-push rule"
    safer_alternative: "follow R-CONNECTOR-ANSWERS"
    provenance: {kind: documented, source: "docs/github-connector.md \"Switching it on\""}
  - id: asked-profile-without-people-answers
    components: [connector-github, engine-api]
    pattern: "asking a profile through the connector without people_answers"
    safer_alternative: "list people_answers"
    provenance: {kind: documented, source: "docs/github-connector.md \"Asking a person\", Who can answer"}
  - id: other-clients-with-connector-profiles
    components: [connector-github, engine-api]
    pattern: "giving another client's token or a bound Worker the connector's profiles while counting on the connector's checks of who answers"
    safer_alternative: "only clients that may answer its questions get those profiles"
    provenance: {kind: documented, source: "docs/github-connector.md \"Asking a person\", Who can answer"}
  - id: answered-by-as-proof
    components: [connector-github, engine-api]
    pattern: "reading answered by or resolved_by as more than the connector's check at answer time"
    safer_alternative: "treat it as the connector's claim, checked once"
    provenance: {kind: documented, source: "docs/github-connector.md \"Who may answer\""}
  - id: answers-always-possible
    components: [connector-github]
    pattern: "counting on answers in the pull request always being possible"
    safer_alternative: "keep the review queue as the fallback"
    provenance: {kind: documented, source: "docs/github-connector.md \"Answering in the pull request\", Limits"}
  - id: copilot-on-every-push
    components: [connector-github]
    pattern: "mapping copilot_review to an action decided on every push, with no rule on github_copilot and no organization budget"
    safer_alternative: "limit reviews with skip_drafts and a rule on github_copilot; keep a Copilot budget"
    provenance: {kind: documented, source: "docs/github-connector.md \"Copilot reviews\", Cost"}

known_non_findings:
  - id: KNF-TOKEN-FAST-HASH
    components: [engine-api, config-repo]
    symptom: credential-storage-weakness
    tool_pattern: "API tokens are hashed with plain SHA-256 instead of a slow password hash"
    conditions: "TOKENS records written by scripts/tokens.mjs; the token is a pm_ token of 32 random bytes"
    discharged_by: [P-TOKEN-HASHED]
    provenance: {kind: documented, source: "src/auth.ts header: \"Tokens are 32 random bytes, so a plain hash is enough (no slow password hash needed)\""}
  - id: KNF-REVOKED-TOKEN-60S
    components: [engine-api, engine-mcp]
    symptom: stale-authentication
    tool_pattern: "a revoked token still works for up to a minute"
    conditions: "revoked through scripts/tokens.mjs revoke less than about 60 seconds before the accepted request"
    discharged_by: [D-REVOCATION-IMMEDIATE]
    provenance: {kind: documented, source: "README \"After a revoke, KV can take up to about 60 seconds\""}
  - id: KNF-REMOVED-MEMBER-7D
    components: [engine-mcp]
    symptom: stale-authorization
    tool_pattern: "a person removed from the GitHub organization can still use MCP"
    conditions: "grant issued while an active member; less than 7 days passed; no new login"
    discharged_by: [D-MEMBERSHIP-AT-LOGIN-ONLY]
    provenance: {kind: documented, source: "docs/mcp.md \"someone removed from the organization keeps access until then\""}
  - id: KNF-CALLBACK-DUPLICATE
    components: [engine-callbacks]
    symptom: duplicate-delivery
    tool_pattern: "the same callback arrived twice"
    conditions: "no 2xx within 10 s on the first attempt or the 2xx was lost; identical payloads"
    discharged_by: [D-EXACTLY-ONCE]
    provenance: {kind: documented, source: "docs/reviews.md \"A callback can arrive more than once if your 2xx answer is lost\""}
  - id: KNF-STATE-IN-GATEWAY-LOGS
    components: [engine-api, engine-mcp]
    symptom: information-disclosure
    tool_pattern: "the full state is visible in the AI Gateway logs although the decision log stores only a hash"
    conditions: "AI_GATEWAY_ID set and collect_logs: true"
    discharged_by: [D-STATE-TO-BACKEND]
    provenance: {kind: documented, source: "docs/models.md \"Logs hold the state\""}
  - id: KNF-TRIAGE-TAINT-TO-SUMMARY
    components: [action-triage]
    symptom: taint-flow-to-sink
    tool_pattern: "untrusted issue text flows from the event payload to GITHUB_STEP_SUMMARY or GITHUB_OUTPUT"
    conditions: "the flagged values are answers, probabilities, labels or the decision id; the issue title and body are not among them"
    discharged_by: [P-TRIAGE-ALLOWLIST]
    provenance: {kind: documented, source: "actions/triage/triage.mjs header: \"it is never put into a shell command or into the job summary\""}

  - id: KNF-STEERED-ANSWER
    components: [engine-api, engine-mcp, bridge, action-triage, action-deploy-watch]
    symptom: prompt-injection-steered-answer
    tool_pattern: "text in the state made the model answer X and the policy acted on that well-formed answer"
    conditions: "every answer inside the profile's types and options; the action is the one the policy produces for those answers; no answer outside the set and no action outside the profile's set"
    discharged_by: [D-PROMPT-INJECTION]
    provenance: {kind: maintainer, date: "2026-10"}
  - id: KNF-INTERNAL-CALL-NO-TOKEN
    components: [engine-api, connector-github]
    symptom: missing-authentication
    tool_pattern: "InternalEngine.decide takes no token, so anyone can decide without one"
    conditions: "the call came through a service binding from a Worker in the engine's own account; it ran as the INTERNAL_CLIENT client with its profiles; no route or URL reached the entrypoint"
    discharged_by: [P-INTERNAL-CLIENT-FROM-ENGINE, D-INTERNAL-ACCOUNT-TRUST]
    provenance: {kind: documented, source: "docs/adapters.md \"Internal calls\""}
  - id: KNF-CALLBACK-TO-PUBLIC-HOST
    components: [engine-callbacks]
    symptom: ssrf-to-public-host
    tool_pattern: "a token holder can make the engine POST to any public https URL"
    conditions: "the URL is public and https; the payload is the signed final answer; no private or loopback address reached and no redirect followed"
    discharged_by: [D-CALLBACK-ANY-PUBLIC-HOST]
    provenance: {kind: maintainer, date: "2026-10"}

