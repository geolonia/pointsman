        caller_must_enforce: "https URLs; one broker credential, not both; a strong NOTIFY_SECRET"
        provenance: {kind: documented, source: "bridge/README.md \"Configuration\""}
  - id: "action-triage run"
    component: action-triage
    parameters:
      - name: workflow-inputs
        attacker_controllable: false
        control_kinds: [data, resource-name]
        obligation_id: action-inputs-from-workflow
        caller_must_enforce: "set url, token, profile, labels, review-label in the workflow; never from event data; pin by full SHA"
        provenance: {kind: documented, source: "actions/triage/README.md \"Inputs\""}
      - name: issue-title-and-body
        attacker_controllable: true
        control_kinds: [data, x-prompt-text]
        caller_must_enforce: "none — P-TRIAGE-ALLOWLIST"
        provenance: {kind: documented, source: "actions/triage/README.md \"The issue text is sent to Pointsman as JSON data; it is never used in a shell command\""}
      - name: pointsman-decision
        attacker_controllable: false
        control_kinds: [data]
        caller_must_enforce: "none — P-TRIAGE-ALLOWLIST"
        provenance: {kind: documented, source: "actions/triage/README.md \"Only labels you list in labels are ever applied\""}
  - id: "action-deploy-watch main"
    component: action-deploy-watch
    parameters:
      - name: run-and-stacks
        attacker_controllable: false
        control_kinds: [callback-code, resource-name]
        obligation_id: action-inputs-from-workflow
        caller_must_enforce: "set url, token, profile, labels, review-label in the workflow; never from event data; pin by full SHA"
        provenance: {kind: documented, source: "actions/deploy-watch/action.yml run: \"Comes from the workflow, never from event data\""}
      - name: other-inputs
        attacker_controllable: false
        control_kinds: [data, resource-name]
        obligation_id: action-inputs-from-workflow
        caller_must_enforce: "set url, token, profile, labels, review-label in the workflow; never from event data; pin by full SHA"
        provenance: {kind: documented, source: "actions/deploy-watch/README.md \"Inputs\""}
      - name: stack-events
        attacker_controllable: true
        control_kinds: [data]
        caller_must_enforce: "none — P-WATCH-FAILSAFE"
        provenance: {kind: maintainer, date: "2026-10"}
      - name: pointsman-action
        attacker_controllable: false
        control_kinds: [data]
        caller_must_enforce: "none — P-WATCH-FAILSAFE"
        provenance: {kind: documented, source: "actions/deploy-watch/README.md \"If Pointsman cannot be reached, nothing is cancelled\""}
  - id: "config-repo workflows"
    component: config-repo
    parameters:
      - name: profiles-yaml
        attacker_controllable: false
        control_kinds: [serialized-state, x-policy-rules]
        obligation_id: protect-config-main
        caller_must_enforce: "protect main; require the Validate check"
        provenance: {kind: documented, source: "template/config-repo/README.md \"Protect main\""}
      - name: engine-json-ref
        attacker_controllable: false
        control_kinds: [resource-name]
        obligation_id: engine-repository-fixed
        caller_must_enforce: "change ENGINE_REPOSITORY only on purpose"
        provenance: {kind: documented, source: "docs/deployment.md \"Updating the engine\""}
      - name: wrangler-config-and-secrets
        attacker_controllable: false
        control_kinds: [serialized-state]
        obligation_id: deploy-through-template
        caller_must_enforce: "placeholders refused; secrets only in the three Cloudflare steps; deploy only through the template's workflows"
        provenance: {kind: documented, source: "docs/deployment.md \"What the workflows do\""}
  - id: "scripts/tokens.mjs"
    component: config-repo
    parameters:
      - name: cli-arguments
        attacker_controllable: false
        control_kinds: [data]
        obligation_id: scoped-tokens
        caller_must_enforce: "one token per client limited to its profiles; client names are unique (create refuses a name in use, rotate replaces the token); --profiles '*' only on purpose; store the printed token as a secret"
        provenance: {kind: documented, source: "README \"API tokens\""}

contract_dimensions:
  # engine-api
  - {component: engine-api, dimension: numeric-domain, status: claimed, conditions: "version 1–999999999, days 1–90, probabilities 0–1, score within range; else 400 or model_error", property_id: P-ANSWER-SHAPE, provenance: {kind: documented, source: "openapi.yaml; docs/profile-format.md \"Engine answer format\""}}
  - {component: engine-api, dimension: failure-atomicity, status: claimed, conditions: "logged before returned; a failed log is 500 and no decision; a review resolves once", property_id: P-DECISION-LOGGED-FIRST, provenance: {kind: documented, source: "docs/decision-log.md; docs/reviews.md"}}
  - {component: engine-api, dimension: recursive-cyclic-topology, status: disclaimed, conditions: "state may be arbitrarily nested; no depth limit promised", property_id: D-STATE-SIZE, provenance: {kind: documented, source: "openapi.yaml DecideRequest.state"}}
  - {component: engine-api, dimension: callback-execution, status: claimed, conditions: "policy conditions are parsed and evaluated as data; nothing runs as code", property_id: P-POLICY-NOT-CODE, provenance: {kind: documented, source: "docs/profile-format.md \"nothing is run as code\""}}
  - {component: engine-api, dimension: serialization-reconstruction, status: claimed, conditions: "plain JSON only; the HTTP model server's model field is not stored", property_id: P-ANSWER-SHAPE, provenance: {kind: maintainer, date: "2026-10"}}
  - {component: engine-api, dimension: reference-lifecycle, status: not-applicable, conditions: "stateless per request; module-level caches hold profiles and adapters, not request data", provenance: {kind: maintainer, date: "2026-10"}}
  - {component: engine-api, dimension: concurrency-reentrancy, status: claimed, conditions: "concurrent resolves of one review: exactly one succeeds", property_id: P-REVIEW-RESOLVED-ONCE, provenance: {kind: documented, source: "docs/reviews.md \"A second resolve, also at the same moment, answers 409\""}}
  - {component: engine-api, dimension: resource-complexity, status: disclaimed, conditions: "no engine-side limit on the size of state; model and fact calls are time-limited; the maintainer chose to disclaim the bound", property_id: D-STATE-SIZE, provenance: {kind: maintainer, date: "2026-10"}}
  - {component: engine-api, dimension: x-prompt-injection, status: disclaimed, conditions: "a state author can steer the answers but not the answer set or the action the policy produces", property_id: D-PROMPT-INJECTION, provenance: {kind: maintainer, date: "2026-10"}}
  - {component: engine-api, dimension: x-probabilistic-result, status: disclaimed, conditions: "p is the model's probability of value, not a calibrated accuracy", property_id: D-MODEL-ACCURACY, provenance: {kind: documented, source: "docs/fiware-demo.md \"Checked again (2026-10-15)\""}}
  # engine-facts
  - {component: engine-facts, dimension: numeric-domain, status: claimed, conditions: "positions within WGS 84; third coordinate dropped; non-finite refused; a pull request number is a whole number from 1 and head 40 hex characters, else no_pr", property_id: P-FACT-LOOKUP-BOUNDED, provenance: {kind: documented, source: "docs/profile-format.md \"Missing GitHub facts\"; maintainer ruling 2026-10"}}
  - {component: engine-facts, dimension: failure-atomicity, status: claimed, conditions: "a failed or slow lookup is missing with a reason; the decision completes; a missing fact never matches a rule; another head commit makes every GitHub fact stale; a push while the file list is read makes the facts that use it stale", property_id: P-FACTS-NEVER-GUESSED, provenance: {kind: documented, source: "docs/profile-format.md \"A missing fact is never guessed\"; \"Missing GitHub facts\""}}
  - {component: engine-facts, dimension: recursive-cyclic-topology, status: not-applicable, conditions: "geometries are flat lists of positions (Point or LineString)", provenance: {kind: documented, source: "docs/profile-format.md \"Facts\" table, at"}}
  - {component: engine-facts, dimension: callback-execution, status: not-applicable, conditions: "no caller-supplied code; providers are operator-configured", provenance: {kind: documented, source: "docs/profile-format.md \"Fact providers\""}}
  - {component: engine-facts, dimension: serialization-reconstruction, status: claimed, conditions: "own PNG decoder (8-bit, non-interlaced) and GeoJSON reduction; GitHub JSON checked field by field; CODEOWNERS read by the engine's own parser, patterns or section headers it does not read make the fact missing; anything else is error", property_id: P-FACTS-NEVER-GUESSED, provenance: {kind: documented, source: "docs/profile-format.md \"Missing GitHub facts\": \"an answer of the wrong shape\"; maintainer ruling 2026-10"}}
  - {component: engine-facts, dimension: reference-lifecycle, status: claimed, conditions: "tiles cached a day in memory (64) and the Workers cache; failed loads not kept; GitHub App installation tokens kept in memory until 5 minutes before they expire, never stored", property_id: P-FACT-LOOKUP-BOUNDED, provenance: {kind: documented, source: "docs/profile-format.md \"Tiles are cached for a day\"; \"Settings\""}}
  - {component: engine-facts, dimension: concurrency-reentrancy, status: claimed, conditions: "a tile load is shared within an isolate and not cancelled by one lookup's timeout; one GitHub snapshot per decision, each part read once, the pull request read again after its files", property_id: P-FACT-LOOKUP-BOUNDED, provenance: {kind: documented, source: "docs/profile-format.md \"One snapshot\"; maintainer ruling 2026-10"}}
  - {component: engine-facts, dimension: resource-complexity, status: claimed, conditions: "≤1000 positions, ≤200 samples, ≤16 flood tiles, ≤9 shelter tiles, ≤5 km detour, 3 s per fact (8 s and ≤ 6 routing calls per detour), 10 s per tile load; GitHub: 5 s per decision, ≤1000 files, ≤250 commits, ≤300 check runs, ≤100 statuses and workflow runs, ≤5 pages of 100 activity entries, ≤100 globs per list matched in linear time; CODEOWNERS patterns through the same matcher, ≤128 KiB file, ≤1024-character patterns, ≤50 million matching steps per decision", property_id: P-FACT-LOOKUP-BOUNDED, provenance: {kind: documented, source: "docs/profile-format.md \"One snapshot\"; maintainer ruling 2026-10"}}
  - {component: engine-facts, dimension: x-prompt-injection, status: not-applicable, conditions: "the model does not see the facts", provenance: {kind: documented, source: "docs/profile-format.md \"The model does not see the facts\""}}
  - {component: engine-facts, dimension: x-probabilistic-result, status: not-applicable, conditions: "facts are measured, not estimated", provenance: {kind: documented, source: "docs/profile-format.md \"Facts are computed by spatial operations instead\""}}
  # engine-callbacks
  - {component: engine-callbacks, dimension: numeric-domain, status: claimed, conditions: "at most 6 attempts with fixed delays; Unix-second timestamps", property_id: P-CALLBACK-SIGNED, provenance: {kind: documented, source: "docs/reviews.md \"Callbacks\""}}
  - {component: engine-callbacks, dimension: failure-atomicity, status: disclaimed, conditions: "at least once; a lost 2xx causes a repeat", property_id: D-EXACTLY-ONCE, provenance: {kind: documented, source: "docs/reviews.md \"A callback can arrive more than once\""}}
  - {component: engine-callbacks, dimension: recursive-cyclic-topology, status: not-applicable, conditions: "one POST per attempt; redirects not followed", provenance: {kind: maintainer, date: "2026-10"}}
  - {component: engine-callbacks, dimension: callback-execution, status: disclaimed, conditions: "the receiver is whoever the token holder named; the engine signs but does not authenticate the receiver", property_id: D-CALLBACK-ANY-PUBLIC-HOST, provenance: {kind: maintainer, date: "2026-10"}}
  - {component: engine-callbacks, dimension: serialization-reconstruction, status: not-applicable, conditions: "the receiver's body is ignored", provenance: {kind: maintainer, date: "2026-10"}}
  - {component: engine-callbacks, dimension: reference-lifecycle, status: claimed, conditions: "a callback is claimed with a 60 s lease before an attempt", property_id: P-CALLBACK-SIGNED, provenance: {kind: maintainer, date: "2026-10"}}
  - {component: engine-callbacks, dimension: concurrency-reentrancy, status: claimed, conditions: "first delivery and cron retry cannot send the same attempt twice", property_id: P-CALLBACK-SIGNED, provenance: {kind: maintainer, date: "2026-10"}}
  - {component: engine-callbacks, dimension: resource-complexity, status: claimed, conditions: "10 s per attempt; at most 50 due callbacks per cron run", property_id: P-CALLBACK-SIGNED, provenance: {kind: documented, source: "docs/reviews.md \"a timeout of 10 seconds\""}}
  - {component: engine-callbacks, dimension: x-prompt-injection, status: not-applicable, conditions: "no model involved", provenance: {kind: documented, source: "docs/reviews.md \"Callbacks\""}}
  - {component: engine-callbacks, dimension: x-probabilistic-result, status: not-applicable, conditions: "the payload carries final answers, not probabilities", provenance: {kind: documented, source: "docs/reviews.md callback example"}}
  # engine-mcp
  - {component: engine-mcp, dimension: numeric-domain, status: claimed, conditions: "access tokens 1 h, grants 7 days", property_id: P-OAUTH-ORG-MEMBERSHIP, provenance: {kind: documented, source: "docs/mcp.md \"Pointsman access tokens last one hour\""}}
  - {component: engine-mcp, dimension: failure-atomicity, status: claimed, conditions: "MCP decisions go through the same checks and log as REST", property_id: P-DECISION-LOGGED-FIRST, provenance: {kind: documented, source: "docs/mcp.md \"Decisions through MCP\""}}
  - {component: engine-mcp, dimension: recursive-cyclic-topology, status: not-applicable, conditions: "stateless Streamable HTTP; no sessions", provenance: {kind: documented, source: "docs/mcp.md \"Streamable HTTP, stateless\""}}
  - {component: engine-mcp, dimension: callback-execution, status: disclaimed, conditions: "the OAuth library fetches a client-ID metadata document from a client-named URL; dynamic client registration is open", property_id: D-OPEN-CLIENT-REGISTRATION, provenance: {kind: documented, source: "docs/mcp.md \"MCP clients register themselves\""}}
  - {component: engine-mcp, dimension: serialization-reconstruction, status: claimed, conditions: "tool inputs validated with zod; grant props stored encrypted by the library", property_id: P-MCP-VISIBILITY, provenance: {kind: maintainer, date: "2026-10"}}
  - {component: engine-mcp, dimension: reference-lifecycle, status: disclaimed, conditions: "membership checked at login only; a removed member keeps access until the grant ends", property_id: D-MEMBERSHIP-AT-LOGIN-ONLY, provenance: {kind: documented, source: "docs/mcp.md \"Membership is checked at login\""}}
  - {component: engine-mcp, dimension: concurrency-reentrancy, status: not-applicable, conditions: "stateless per request; the OAuth library owns its handles", provenance: {kind: maintainer, date: "2026-10"}}
  - {component: engine-mcp, dimension: resource-complexity, status: disclaimed, conditions: "no per-person rate limit; expired OAuth records purged 100 at a time", property_id: D-RATE-LIMIT, provenance: {kind: maintainer, date: "2026-10"}}
  - {component: engine-mcp, dimension: x-prompt-injection, status: disclaimed, conditions: "as for engine-api; the MCP caller is often an LLM agent", property_id: D-PROMPT-INJECTION, provenance: {kind: maintainer, date: "2026-10"}}
  - {component: engine-mcp, dimension: x-probabilistic-result, status: disclaimed, conditions: "as for engine-api", property_id: D-MODEL-ACCURACY, provenance: {kind: documented, source: "docs/mcp.md \"Tools\": \"typed answers with probabilities\""}}
  # bridge
  - {component: bridge, dimension: numeric-domain, status: claimed, conditions: "queue messages ≤120 KB, batches ≤100/250 KB; retries 30 s doubling to 1 h; reviewedBy ≤100 characters", property_id: P-BRIDGE-SAFE-TO-REPEAT, provenance: {kind: documented, source: "bridge/README.md \"Reliable delivery (queue)\"; \"Work orders from other apps\""}}
  - {component: bridge, dimension: failure-atomicity, status: disclaimed, conditions: "NGSI-LD has no conditional update; a writer can get through between a read and a write", property_id: D-BRIDGE-RACE-WINDOWS, provenance: {kind: documented, source: "bridge/README.md \"NGSI-LD has no conditional update, so there is a short window\""}}
  - {component: bridge, dimension: recursive-cyclic-topology, status: claimed, conditions: "input hash and attribute-level PATCH keep own writes from starting a new decision", property_id: P-BRIDGE-LOOP-GUARD, provenance: {kind: documented, source: "bridge/README.md \"How it avoids loops\""}}
  - {component: bridge, dimension: callback-execution, status: not-applicable, conditions: "the bridge runs no caller code; routes are operator configuration", provenance: {kind: documented, source: "bridge/README.md \"Configuration\""}}
  - {component: bridge, dimension: serialization-reconstruction, status: claimed, conditions: "entities are plain JSON; values read by NGSI-LD kind; dates checked as RFC 3339", property_id: P-BRIDGE-SAFE-TO-REPEAT, provenance: {kind: maintainer, date: "2026-10"}}
  - {component: bridge, dimension: reference-lifecycle, status: claimed, conditions: "Task ids derived from entity id, attribute and input hash; own Tasks recognised by id", property_id: P-BRIDGE-SAFE-TO-REPEAT, provenance: {kind: documented, source: "bridge/README.md \"Task entities\""}}
  - {component: bridge, dimension: concurrency-reentrancy, status: disclaimed, conditions: "two simultaneous notifications for one Decision can both send the same feedback; max_concurrency 1 is the operator's job", property_id: D-BRIDGE-RACE-WINDOWS, provenance: {kind: documented, source: "bridge/README.md \"Two notifications for the same Decision at the same moment can both send the same corrections\""}}
  - {component: bridge, dimension: resource-complexity, status: claimed, conditions: "one Pointsman call and a bounded number of broker calls per entity; oversized entities handled inline", property_id: P-BRIDGE-LOOP-GUARD, provenance: {kind: maintainer, date: "2026-10"}}
  - {component: bridge, dimension: x-prompt-injection, status: disclaimed, conditions: "the whole entity is the state; whoever writes an entity writes the prompt text", property_id: D-PROMPT-INJECTION, provenance: {kind: maintainer, date: "2026-10"}}
  - {component: bridge, dimension: x-probabilistic-result, status: disclaimed, conditions: "probabilities are written to the broker as sub-properties; the action is the value", property_id: D-MODEL-ACCURACY, provenance: {kind: documented, source: "bridge/README.md \"The result on the entity\""}}
  # action-triage
  - {component: action-triage, dimension: numeric-domain, status: claimed, conditions: "label names 1–50 characters; mapping keys ≤100; 30 s timeout", property_id: P-TRIAGE-ALLOWLIST, provenance: {kind: documented, source: "actions/triage/README.md \"Inputs\""}}
  - {component: action-triage, dimension: failure-atomicity, status: claimed, conditions: "on failure the review label is added and the step fails", property_id: P-TRIAGE-ALLOWLIST, provenance: {kind: documented, source: "actions/triage/README.md \"Pointsman cannot be reached or fails\""}}
  - {component: action-triage, dimension: recursive-cyclic-topology, status: not-applicable, conditions: "one event, one decision, one label call", provenance: {kind: documented, source: "actions/triage/README.md"}}
  - {component: action-triage, dimension: callback-execution, status: claimed, conditions: "issue text never reaches a shell or the step summary", property_id: P-TRIAGE-ALLOWLIST, provenance: {kind: documented, source: "actions/triage/README.md"}}
  - {component: action-triage, dimension: serialization-reconstruction, status: claimed, conditions: "event JSON parsed; only issues opened/reopened without pull_request handled", property_id: P-TRIAGE-ALLOWLIST, provenance: {kind: documented, source: "actions/triage/triage.mjs comment \"Only new (or reopened) issues\""}}
  - {component: action-triage, dimension: reference-lifecycle, status: not-applicable, conditions: "no state between runs", provenance: {kind: documented, source: "actions/triage/README.md"}}
  - {component: action-triage, dimension: concurrency-reentrancy, status: not-applicable, conditions: "one run per event", provenance: {kind: documented, source: "actions/triage/README.md"}}
  - {component: action-triage, dimension: resource-complexity, status: claimed, conditions: "one Pointsman call, one GitHub API call", property_id: P-TRIAGE-ALLOWLIST, provenance: {kind: documented, source: "actions/triage/README.md"}}
  - {component: action-triage, dimension: x-prompt-injection, status: disclaimed, conditions: "the issue author writes the prompt text; labels come from the allow-list", property_id: D-PROMPT-INJECTION, provenance: {kind: maintainer, date: "2026-10"}}
  - {component: action-triage, dimension: x-probabilistic-result, status: disclaimed, conditions: "the job summary shows p; the policy threshold decides", property_id: D-MODEL-ACCURACY, provenance: {kind: documented, source: "actions/triage/README.md \"The job summary shows the answers, their probabilities\""}}
  # action-deploy-watch
  - {component: action-deploy-watch, dimension: numeric-domain, status: claimed, conditions: "consecutive ≥1, interval-seconds ≥0.05, kill-after-seconds ≥0; stack names bounded", property_id: P-WATCH-FAILSAFE, provenance: {kind: documented, source: "actions/deploy-watch/README.md \"Inputs\""}}
  - {component: action-deploy-watch, dimension: failure-atomicity, status: claimed, conditions: "unreachable Pointsman or unreadable stack never cancels", property_id: P-WATCH-FAILSAFE, provenance: {kind: documented, source: "actions/deploy-watch/README.md \"If Pointsman cannot be reached, nothing is cancelled\""}}
  - {component: action-deploy-watch, dimension: recursive-cyclic-topology, status: not-applicable, conditions: "a polling loop bounded by the deploy command's lifetime", provenance: {kind: documented, source: "actions/deploy-watch/README.md \"How it decides\""}}
  - {component: action-deploy-watch, dimension: callback-execution, status: not-applicable, conditions: "run is executed with bash -c as written and is a trusted workflow-author input (§1.7)", provenance: {kind: documented, source: "actions/deploy-watch/action.yml run: \"Comes from the workflow, never from event data\""}}
  - {component: action-deploy-watch, dimension: serialization-reconstruction, status: claimed, conditions: "aws CLI JSON reduced to fixed fields; reasons truncated to 300 characters", property_id: P-WATCH-FAILSAFE, provenance: {kind: maintainer, date: "2026-10"}}
  - {component: action-deploy-watch, dimension: reference-lifecycle, status: claimed, conditions: "own process group; SIGTERM then SIGKILL after kill-after-seconds", property_id: P-WATCH-FAILSAFE, provenance: {kind: documented, source: "actions/deploy-watch/README.md \"Inputs\": kill-after-seconds"}}
  - {component: action-deploy-watch, dimension: concurrency-reentrancy, status: not-applicable, conditions: "one watcher per job", provenance: {kind: documented, source: "actions/deploy-watch/README.md"}}
  - {component: action-deploy-watch, dimension: resource-complexity, status: claimed, conditions: "at most one Pointsman call per quiet interval", property_id: P-WATCH-FAILSAFE, provenance: {kind: documented, source: "actions/deploy-watch/README.md \"Rule first\""}}
  - {component: action-deploy-watch, dimension: x-prompt-injection, status: disclaimed, conditions: "stack event text is the prompt; a steered answer can at most stop a deploy after consecutive cancel answers", property_id: D-PROMPT-INJECTION, provenance: {kind: maintainer, date: "2026-10"}}
  - {component: action-deploy-watch, dimension: x-probabilistic-result, status: disclaimed, conditions: "the profile's policy threshold decides cancel", property_id: D-MODEL-ACCURACY, provenance: {kind: documented, source: "actions/deploy-watch/README.md \"Pointsman for unclear cases\""}}
  # config-repo
  - {component: config-repo, dimension: numeric-domain, status: claimed, conditions: "engine.json ref is a 40-character SHA; profile version is a positive integer that must increase", property_id: P-PROFILE-VERSION-IMMUTABLE, provenance: {kind: documented, source: "docs/deployment.md \"Profile versions\"; template deploy workflow \"Read engine.json\""}}
  - {component: config-repo, dimension: failure-atomicity, status: claimed, conditions: "the deploy stops before any Cloudflare change on a failed check; a changed published version stops the publish", property_id: P-PROFILE-VERSION-IMMUTABLE, provenance: {kind: documented, source: "docs/deployment.md \"What the workflows do\""}}
  - {component: config-repo, dimension: recursive-cyclic-topology, status: not-applicable, conditions: "no graph inputs", provenance: {kind: documented, source: "docs/deployment.md"}}
  - {component: config-repo, dimension: callback-execution, status: claimed, conditions: "workflows run only code from geolonia/pointsman at the pinned commit", property_id: P-PROFILE-VERSION-IMMUTABLE, provenance: {kind: documented, source: "docs/deployment.md \"Updating the engine\""}}
  - {component: config-repo, dimension: serialization-reconstruction, status: claimed, conditions: "profiles validated against the schema and their policy compiled before publication", property_id: P-POLICY-NOT-CODE, provenance: {kind: documented, source: "docs/deployment.md \"Validate\""}}
  - {component: config-repo, dimension: reference-lifecycle, status: claimed, conditions: "old profile versions stay in KV so feedback on old decisions is checked against the version that made them", property_id: P-PROFILE-VERSION-IMMUTABLE, provenance: {kind: documented, source: "docs/deployment.md \"Old versions stay in KV\""}}
  - {component: config-repo, dimension: concurrency-reentrancy, status: claimed, conditions: "deploys run one at a time; D1 registration is strongly consistent", property_id: P-PROFILE-VERSION-IMMUTABLE, provenance: {kind: documented, source: "migrations/0002_profile_versions.sql comment; template deploy workflow concurrency"}}
  - {component: config-repo, dimension: resource-complexity, status: not-applicable, conditions: "a deploy pipeline, not a request path", provenance: {kind: documented, source: "docs/deployment.md"}}
  - {component: config-repo, dimension: x-prompt-injection, status: not-applicable, conditions: "no state reaches a model here", provenance: {kind: documented, source: "docs/deployment.md"}}
  - {component: config-repo, dimension: x-probabilistic-result, status: not-applicable, conditions: "not applicable to a deploy pipeline", provenance: {kind: documented, source: "docs/deployment.md"}}

outputs:
  - component: engine-api
    channel: decision
    taint: constrained
    taint_provenance: {kind: documented, source: "docs/profile-format.md \"Engine answer format\""}
    invariants:
      - id: answers-from-closed-set
        statement: "answers[*].value is a boolean, a listed option or a listed level; action is one of the profile's actions"
        property_id: P-ANSWER-SHAPE
        provenance: {kind: documented, source: "docs/profile-format.md \"Engine answer format\""}
    downstream_must_not_assume:
      - id: action-is-right
        statement: "that the action is right or that p is a calibrated accuracy"
        provenance: {kind: documented, source: "docs/fiware-demo.md \"Lesson: keep a margin from the thresholds\""}
      - id: test-decision-is-logged
        statement: "that a test: true decision was logged or will reach the review queue"
        provenance: {kind: documented, source: "README \"API tokens\" on test tokens"}
  - component: engine-api
    channel: decision-record
    taint: constrained
    taint_provenance: {kind: documented, source: "docs/decision-log.md \"What is stored\""}
    invariants:
      - id: callback-url-never-returned
        statement: "callback_url is never returned; state only with log.store_state"
        property_id: P-STATE-NOT-STORED
        provenance: {kind: documented, source: "docs/decision-log.md \"callback_url ... not returned by the API\""}
    downstream_must_not_assume:
      - id: by-is-verified
        statement: "that by or resolved_by names a verified person"
        provenance: {kind: documented, source: "migrations/0001_decisions.sql comment \"who corrected it, as given by the client\""}
      - id: state-hash-hides-input
        statement: "that state_hash hides the input from someone who can guess it"
        provenance: {kind: maintainer, date: "2026-10"}
      - id: record-is-tamper-evident
        statement: "that the record is tamper-evident"
        provenance: {kind: documented, source: "docs/deployment.md \"Deployment\" table"}
  - component: engine-api
