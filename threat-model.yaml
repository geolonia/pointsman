components:
  - name: engine-api
    scope: in
    reachability_precondition: "reachable from a request with a valid token, from the state, ref or callback_url it carries, or from a model backend response; the internal call (InternalEngine) only from a Worker in the same Cloudflare account with a binding, and only with INTERNAL_CLIENT set; /connectors/<id>/ from any request, under the connector's own authentication, and the queue consumer from the Worker's queue; since pointsman#221 (v0.16.0) also InternalEngine get, resolve and close, and POST /v1/reviews/{id}/close"
    provenance: {kind: documented, source: "README \"API\""}
  # GitHub facts here means all nine types of @pointsman/github; CodeRabbit facts the four types of
  # @pointsman/coderabbit; facts from the decision log and connectors inside the engine Worker are covered
  # since the amendment of 2026-10-24 (prose §1.2, §1.16).
  - name: engine-facts
    scope: in
    reachability_precondition: "reachable from the geometry at a profile's `at` path in the client's state, from the pull request (repo, number, head) at a GitHub fact's `at` path, or from a tile, routing, GitHub API or npm registry response, including workflow files, patches, comments, reviews and statuses, other pull requests' head statuses, and the asking client's own earlier decisions"
    provenance: {kind: documented, source: "docs/profile-format.md \"Facts\", \"GitHub pull requests\""}
  - name: engine-callbacks
    scope: in
    reachability_precondition: "reachable from callback_url or from the receiver's response"
    provenance: {kind: documented, source: "docs/reviews.md \"Callbacks\""}
  - name: engine-mcp
    scope: in
    reachability_precondition: "reachable from an MCP tool call with a valid API token or OAuth access token, or from the OAuth routes before login"
    provenance: {kind: documented, source: "docs/mcp.md"}
  - name: bridge
    scope: in
    reachability_precondition: "reachable from a notification carrying the shared secret, from the entities in it, from a queue message, or from a broker or Pointsman response, in its own Worker or under /connectors/fiware/ inside the engine Worker"
    provenance: {kind: documented, source: "bridge/README.md \"Why a bridge\""}
  - name: connector-github
    scope: in
    reachability_precondition: "reachable from a webhook with a valid X-Hub-Signature-256 (pull-request, review and check-suite events; closed only with the decision comment or answers), from the pull request it then reads (title, description, diff by the pull-request author), from a GitHub API response including the review decision, or from the engine's answer; since pointsman#221 (v0.16.0) from a decision read back; since pointsman#222 (v0.16.0), where answers are on, from check_run requested_action and (with the command) issue_comment created webhooks, their sender and the comment's text, and GitHub's answers about the person's permission and the head's newest push"
    provenance: {kind: documented, source: "docs/github-connector.md \"Safety\""}
  - name: action-triage
    scope: in
    reachability_precondition: "reachable from the issue title and body in the event payload, or from Pointsman's response"
    provenance: {kind: documented, source: "actions/triage/README.md"}
  - name: action-deploy-watch
    scope: in
    reachability_precondition: "reachable from CloudFormation stack events or from Pointsman's response; run and stacks are trusted workflow inputs"
    provenance: {kind: documented, source: "actions/deploy-watch/README.md"}
  - name: config-repo
    scope: in
    reachability_precondition: "reachable from a pull request to the config repository or from the operator's command line; both are trusted authors"
    provenance: {kind: documented, source: "docs/deployment.md \"Set up\""}
  - name: examples-site-spikes-tests-tooling
    scope: out
    reason: "example profiles (bundled only in the dev config), the website, spikes, tests and developer scripts do not run in a deployment, per §1.3"
    provenance: {kind: documented, source: "README \"Decision profiles\": \"This repository holds only example profiles\""}
  - name: pointsman-demo
    scope: out
    reason: "separate repository geolonia/pointsman-demo with its own limits, per §1.3"
    provenance: {kind: documented, source: "docs/fiware-demo.md \"How it runs\""}

host_side_effects:
  - effect: network-sockets
    stance: conditional
    components: [engine-api, engine-facts, engine-callbacks, engine-mcp, bridge, action-triage, action-deploy-watch, config-repo, connector-github]
    conditions: "only the model backend, the GSI tile hosts, the Valhalla server, callback_url, github.com/api.github.com (OAuth, and GitHub and CodeRabbit facts: REST GET, two fixed GraphQL queries, one installation-token POST), registry.npmjs.org (github_bump: GET only, no credential) and OAuth client-ID metadata URLs (engine), a fact source only when engine.json chooses its module; the broker and Pointsman (bridge); Pointsman and the GitHub API (actions); api.github.com with the connector app (reads, one GraphQL query for the review decision, check runs, the decision comment, comments, labels, review requests, reviews, dismissals; since pointsman#222 (v0.16.0) a person's permission, the head branch's newest activity entry, check runs with buttons); connectors inside the engine Worker reach the engine in process, not by the network and Pointsman at POINTSMAN_URL or through the InternalEngine binding (connector-github); the Cloudflare API through wrangler (config-repo); all public addresses only"
    provenance: {kind: maintainer, date: "2026-10"}
  - effect: child-processes
    stance: absent
    components: [engine-api, engine-facts, engine-callbacks, engine-mcp, bridge, action-triage, config-repo, connector-github]
    conditions: "grep for child_process/spawn/execFile in src, bridge/src, packages/*/src and connectors/*/src: no call (the one hit is a word list in packages/github/src/workflows.ts); config-repo scripts call wrangler through scripts/lib/wrangler.mjs"
    provenance: {kind: maintainer, date: "2026-10"}
  - effect: child-processes
    stance: present
    components: [action-deploy-watch]
    conditions: "spawns `bash -c <run>` in its own process group and runs the aws CLI"
    provenance: {kind: documented, source: "actions/deploy-watch/README.md \"How it decides\""}
  - effect: environment-reads
    stance: absent
    components: [engine-api, engine-facts, engine-callbacks, engine-mcp, bridge, connector-github]
    conditions: "configuration comes from Worker bindings and vars only; each fact module and each connector inside the engine Worker is handed only the settings its module lists (the CodeRabbit module lists the GitHub module's); grep for process.env in src, bridge/src, packages/*/src and connectors/*/src: 0 hits"
    provenance: {kind: maintainer, date: "2026-10"}
  - effect: environment-reads
    stance: present
    components: [action-triage, action-deploy-watch, config-repo]
    conditions: "INPUT_* and GITHUB_* variables (actions); CLOUDFLARE_* secrets in the deploy workflow"
    provenance: {kind: documented, source: "the Actions' action.yml inputs; docs/deployment.md \"Add the secrets\""}
  - effect: filesystem
    stance: absent
    components: [engine-api, engine-facts, engine-callbacks, engine-mcp, bridge, connector-github]
    conditions: "Workers have no filesystem; no fs import in src, bridge/src, packages/*/src or connectors/*/src"
    provenance: {kind: maintainer, date: "2026-10"}
  - effect: filesystem
    stance: present
    components: [action-triage, action-deploy-watch]
    conditions: "appends to GITHUB_OUTPUT and GITHUB_STEP_SUMMARY; reads GITHUB_EVENT_PATH"
    provenance: {kind: documented, source: "actions/triage/triage.mjs header comment"}
  - effect: storage-writes
    stance: present
    components: [engine-api, engine-callbacks, engine-mcp, engine-facts]
    conditions: "D1 decisions and feedback rows; OAUTH_KV (purge cursor and the OAuth library's grants); the Workers cache for tiles; never TOKENS or PROFILES; facts from the decision log only read it"
    provenance: {kind: maintainer, date: "2026-10"}
  - effect: storage-writes
    stance: present
    components: [connector-github]
    conditions: "the PullRequest Durable Object's storage: seen delivery ids and body hashes, check-run and action records, its own approvals, the decision comment's record and the last read of the reviews; since pointsman#221 (v0.16.0) the questions asked and those still to be closed; since pointsman#222 (v0.16.0) the answers waiting, the hour's answer counts and pending button removals; in the connector's own Worker"
    provenance: {kind: documented, source: "packages/github/src/connector/pull-request.ts header comment"}
  - effect: redirect-following
    stance: absent
    components: [engine-api, engine-facts, engine-callbacks]
    conditions: "outbound calls to the model server, the routing server, callback_url, the GitHub API and the npm registry use redirect: 'manual' and treat a 3xx as an error, except the organization-membership read, where a 302 means not known; no redirect is followed"
    provenance: {kind: documented, source: "docs/profile-format.md \"Detours\": \"Redirects are not followed\"; \"Missing GitHub facts\""}
  - effect: redirect-following
    stance: absent
    components: [bridge]
    conditions: "calls to the broker and to Pointsman use redirect: 'manual' and treat a 3xx as an error, checked before the body is read"
    provenance: {kind: documented, source: "bridge/README.md \"Configuration\": \"The bridge does not follow redirects\""}
  - effect: redirect-following
    stance: absent
    components: [connector-github]
    conditions: "the connector's GitHub calls and its HTTP calls to the engine use redirect: 'manual'; a 3xx is an error"
    provenance: {kind: documented, source: "packages/github/src/connector/github.ts and packages/github/src/connector/engine.ts, redirect manual"}
  - effect: global-state
    stance: conditional
    components: [engine-api, engine-facts, engine-mcp]
    conditions: "module-level caches (profile store, adapters, OAuth server map, and the providers each fact module keeps: GSI provider and tile memory cache, Valhalla routers, GitHub fact providers with a GitHub App's installation tokens, CodeRabbit providers) shared within one isolate only; the pull-request snapshot is per decision"
    provenance: {kind: maintainer, date: "2026-10"}
  - effect: logging
    stance: present
    components: [engine-api, engine-facts, engine-callbacks, engine-mcp, bridge, connector-github]
    conditions: "console.error (and one console.warn in the connector) with reasons only; never the state, a token, a key or a model response; the AI Gateway keeps the state when collect_logs is on"
    provenance: {kind: documented, source: "docs/models.md \"Errors and logs never include the request, the response body or the key\""}

entry_points:
  - id: "v1-auth-middleware"
    component: engine-api
    parameters:
      - name: authorization-header
        attacker_controllable: true
        control_kinds: [data]
        caller_must_enforce: "none — P-AUTH-REQUIRED"
        provenance: {kind: documented, source: "README \"API tokens\""}
      - name: token-record
        attacker_controllable: false
        control_kinds: [serialized-state]
        obligation_id: operator-only-token-writes
        caller_must_enforce: "keep TOKENS writable only by operators"
        provenance: {kind: documented, source: "docs/deployment.md \"Deployment\" table"}
  - id: "GET /v1/profiles"
    component: engine-api
    parameters:
      - name: none-beyond-token
        attacker_controllable: false
        control_kinds: [data]
        caller_must_enforce: "none — P-TOKEN-SCOPE"
        provenance: {kind: documented, source: "openapi.yaml /v1/profiles"}
  - id: "GET /v1/profiles/{id}/graph"
    component: engine-api
    parameters:
      - name: id-format
        attacker_controllable: true
        control_kinds: [resource-name, data]
        caller_must_enforce: "none — P-TOKEN-SCOPE; only profiles in scope are in the graph"
        provenance: {kind: documented, source: "openapi.yaml /v1/profiles/{id}/graph"}
  - id: "POST /v1/decide/{profile}"
    component: engine-api
    parameters:
      - name: profile
        attacker_controllable: true
        control_kinds: [resource-name]
        caller_must_enforce: "none — P-TOKEN-SCOPE"
        provenance: {kind: documented, source: "docs/decision-log.md \"A token sees and corrects only decisions of profiles in its scope\""}
      - name: version
        attacker_controllable: true
        control_kinds: [data]
        caller_must_enforce: "none — P-TOKEN-SCOPE"
        provenance: {kind: documented, source: "openapi.yaml /v1/decide/{profile} version parameter"}
      - name: state
        attacker_controllable: true
        control_kinds: [data, size, x-prompt-text]
        obligation_id: treat-state-as-data
        caller_must_enforce: "treat state as untrusted data: never in a shell, query or template; no secrets or personal data unless log.store_state and gateway logging are intended"
        provenance: {kind: documented, source: "openapi.yaml DecideRequest.state"}
      - name: state-size
        attacker_controllable: true
        control_kinds: [size, object-topology]
        obligation_id: rate-limit-at-edge
        caller_must_enforce: "rate-limit and budget at the edge and in the AI Gateway; the engine sets no size or rate limit"
        provenance: {kind: maintainer, date: "2026-10"}
      - name: ref
        attacker_controllable: true
        control_kinds: [data]
        obligation_id: ref-no-secrets
        caller_must_enforce: "1–200 characters; it is logged and returned, so no secrets"
        provenance: {kind: documented, source: "openapi.yaml DecideRequest.ref"}
      - name: decisions
        attacker_controllable: true
        control_kinds: [resource-name]
        caller_must_enforce: "none — P-CHAIN-INPUTS-FROM-LOG"
        provenance: {kind: documented, source: "docs/profile-format.md \"Decision chains\""}
      - name: Idempotency-Key
        attacker_controllable: true
        control_kinds: [data]
        obligation_id: idempotency-key-per-client
        caller_must_enforce: "1–200 printable ASCII characters; keys are per client"
        provenance: {kind: documented, source: "docs/decision-log.md \"Repeated requests\""}
      - name: callback_url
        attacker_controllable: true
        control_kinds: [resource-name]
        obligation_id: callback-url-https-public
        caller_must_enforce: "https only; any public host; refused for test tokens"
        provenance: {kind: documented, source: "openapi.yaml DecideRequest.callback_url"}
      - name: profile-content
        attacker_controllable: false
        control_kinds: [serialized-state, x-policy-rules]
        obligation_id: validate-and-version-profiles
        caller_must_enforce: "validate with validate-profiles.mjs; bump the version on every change"
        provenance: {kind: documented, source: "docs/deployment.md \"Profile versions\""}
      - name: model-response
        attacker_controllable: true
        control_kinds: [collaborator-implementation, data]
        caller_must_enforce: "none — P-ANSWER-SHAPE"
        provenance: {kind: documented, source: "docs/profile-format.md \"Engine answer format\""}
      - name: model-name-http-server
        attacker_controllable: false
        control_kinds: [data]
        caller_must_enforce: "none — P-ANSWER-SHAPE"
        provenance: {kind: maintainer, date: "2026-10"}
      - name: model-name-workers-ai
        attacker_controllable: false
        control_kinds: [data]
        caller_must_enforce: "none — P-ANSWER-SHAPE"
        provenance: {kind: maintainer, date: "2026-10"}
      - name: fact-geometry
        attacker_controllable: true
        control_kinds: [data, size]
        caller_must_enforce: "none — P-FACT-LOOKUP-BOUNDED"
        provenance: {kind: documented, source: "docs/profile-format.md \"Facts\" table, at"}
      - name: github-pull-request
        attacker_controllable: true
        control_kinds: [resource-name, data]
        obligation_id: github-credential-reach
        caller_must_enforce: "scope the GitHub credential to the repositories the deployment decides about (D-GITHUB-CREDENTIAL-REACH); the facts are for the named head only (P-GITHUB-FACTS-FOR-HEAD)"
        provenance: {kind: documented, source: "docs/profile-format.md \"Missing GitHub facts\", no_pr"}
      - name: github-fact-settings
        attacker_controllable: false
        control_kinds: [x-policy-rules, size]
        obligation_id: github-rules-known-positive
        caller_must_enforce: "1 to 100 globs in paths, at most 100 in except; a glob that misses files is the profile author's error"
        provenance: {kind: documented, source: "docs/profile-format.md \"GitHub pull requests\", fact settings table"}
  - id: "GET /v1/decisions/{id}"
    component: engine-api
    parameters:
      - name: id
        attacker_controllable: true
        control_kinds: [resource-name]
        caller_must_enforce: "none — P-TOKEN-SCOPE"
        provenance: {kind: documented, source: "docs/decision-log.md \"Other decisions answer 404, as if they did not exist\""}
  - id: "POST /v1/decisions/{id}/feedback"
    component: engine-api
    parameters:
      - name: correct
        attacker_controllable: true
        control_kinds: [data, type-class]
        caller_must_enforce: "none — P-ANSWER-SHAPE"
        provenance: {kind: documented, source: "docs/decision-log.md \"Feedback\""}
      - name: by-and-note
        attacker_controllable: true
        control_kinds: [data]
        obligation_id: reviewer-attribution
        caller_must_enforce: "if who resolved matters, authenticate the person in the client and put an account identifier in by"
        provenance: {kind: documented, source: "migrations/0001_decisions.sql comment \"who corrected it, as given by the client\""}
  - id: "GET /v1/stats/{profile}"
    component: engine-api
    parameters:
