        control_kinds: [resource-name, data]
        caller_must_enforce: "none — P-TOKEN-SCOPE"
        provenance: {kind: documented, source: "openapi.yaml /v1/stats/{profile}"}
  - id: "GET /v1/reviews"
    component: engine-api
    parameters:
      - name: profile
        attacker_controllable: true
        control_kinds: [resource-name]
        caller_must_enforce: "none — P-TOKEN-SCOPE"
        provenance: {kind: documented, source: "docs/reviews.md \"Review queue\""}
  - id: "POST /v1/reviews/{id}/resolve"
    component: engine-api
    parameters:
      - name: action
        attacker_controllable: true
        control_kinds: [data]
        obligation_id: final-action-is-acted-on
        caller_must_enforce: "one of the profile's people_answers, else 400; it is the final action the client will act on; any token in scope may resolve, also the GitHub connector's question, which then carries out the mapped action (D-RESOLVE-BY-SCOPE)"
        provenance: {kind: documented, source: "docs/reviews.md \"action is the final answer\""}
      - name: correct-by-note
        attacker_controllable: true
        control_kinds: [data, type-class]
        obligation_id: reviewer-attribution
        caller_must_enforce: "if who resolved matters, authenticate the person in the client and put an account identifier in by"
        provenance: {kind: documented, source: "docs/reviews.md \"Review queue\""}
