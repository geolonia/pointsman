outputs:
  - component: engine-api
    channel: decision
    taint: constrained
    taint_provenance: {kind: documented, source: "docs/profile-format.md \"Engine answer format\""}
    invariants:
      - id: answers-from-closed-set
        statement: "answers[*].value is a boolean, a listed option or a listed level; action is one of the profile's actions"
        property_id: P-ANSWER-SHAPE
        provenance: {kind: documented, source: "docs/profile-format.md \"Engine answer format\""}
    downstream_must_not_assume:
      - id: action-is-right
        statement: "that the action is right or that p is a calibrated accuracy"
        provenance: {kind: documented, source: "docs/fiware-demo.md \"Lesson: keep a margin from the thresholds\""}
      - id: test-decision-is-logged
        statement: "that a test: true decision was logged or will reach the review queue"
        provenance: {kind: documented, source: "README \"API tokens\" on test tokens"}
  - component: engine-api
    channel: decision-record
    taint: constrained
    taint_provenance: {kind: documented, source: "docs/decision-log.md \"What is stored\""}
    invariants:
      - id: callback-url-never-returned
        statement: "callback_url is never returned; state only with log.store_state"
        property_id: P-STATE-NOT-STORED
        provenance: {kind: documented, source: "docs/decision-log.md \"callback_url ... not returned by the API\""}
    downstream_must_not_assume:
      - id: by-is-verified
        statement: "that by or resolved_by names a verified person"
        provenance: {kind: documented, source: "migrations/0001_decisions.sql comment \"who corrected it, as given by the client\""}
      - id: state-hash-hides-input
        statement: "that state_hash hides the input from someone who can guess it"
        provenance: {kind: maintainer, date: "2026-10"}
      - id: record-is-tamper-evident
        statement: "that the record is tamper-evident"
        provenance: {kind: documented, source: "docs/deployment.md \"Deployment\" table"}
  - component: engine-api
    channel: review-list-and-stats
    taint: constrained
    taint_provenance: {kind: documented, source: "docs/reviews.md \"Review queue\"; docs/decision-log.md \"Counts only, no single decisions\""}
    invariants: []
    downstream_must_not_assume: []
  - component: engine-api
    channel: error-bodies-and-workers-log
    taint: constrained
    taint_provenance: {kind: documented, source: "docs/models.md \"Errors and logs never include the request, the response body or the key\""}
    invariants:
      - id: logs-carry-reasons-only
        statement: "no state, token, key or model response in logs or error bodies"
        property_id: P-SECRETS-NOT-LOGGED
        provenance: {kind: documented, source: "docs/models.md \"Errors and logs never include the request, the response body or the key\""}
    downstream_must_not_assume: []
  - component: engine-api
    channel: model-request
    taint: same-as-input
    taint_provenance: {kind: documented, source: "docs/models.md \"Logs hold the state\""}
    invariants: []
    downstream_must_not_assume:
      - id: backend-keeps-nothing
        statement: "that the backend keeps nothing: the AI Gateway logs the state when collect_logs is on; a model server's retention is its own"
        provenance: {kind: documented, source: "docs/models.md \"Logs hold the state\""}
  - component: engine-facts
    channel: fact-queries
    taint: same-as-input
    taint_provenance: {kind: documented, source: "docs/profile-format.md \"Fact providers\", \"Detours\""}
    invariants: []
    downstream_must_not_assume:
      - id: location-not-shared
        statement: "that the location is not shared with the GSI hosts or the Valhalla server"
        provenance: {kind: documented, source: "docs/profile-format.md \"Detours\""}
  - component: engine-facts
    channel: github-reads
    taint: same-as-input
    taint_provenance: {kind: documented, source: "docs/profile-format.md \"Settings\": \"Making the token is the only request that is not a read\""}
    invariants:
      - id: github-read-only
        statement: "for the covered facts GET requests to api.github.com only, plus one POST that creates a GitHub App installation token; redirects not followed"
        property_id: P-GITHUB-READ-ONLY
        provenance: {kind: documented, source: "packages/github/src/provider.ts header"}
    downstream_must_not_assume:
      - id: github-does-not-learn-prs
        statement: "that GitHub does not learn which pull requests the deployment decides about"
        provenance: {kind: documented, source: "docs/profile-format.md \"Settings\""}
  - component: engine-facts
    channel: github-fact-values
    taint: constrained
    taint_provenance: {kind: documented, source: "docs/profile-format.md \"GitHub pull requests\" table"}
    invariants:
      - id: github-facts-for-head
        statement: "every GitHub fact of a decision describes the head commit the request named, or is stale"
        property_id: P-GITHUB-FACTS-FOR-HEAD
        provenance: {kind: documented, source: "docs/profile-format.md \"GitHub pull requests\""}
    downstream_must_not_assume:
      - id: property-value-safe
        statement: "that a custom property value, github_workflows.detail or a CodeRabbit fact's author is safe for any grammar (detail can hold @)"
        provenance: {kind: documented, source: "docs/profile-format.md \"GitHub pull requests\" table, github_property"}
      - id: push-and-owner-fields-as-review
        statement: "that pushed_by_author yes shows who wrote the commits, or that author_sole_code_owner means nobody else should look"
        provenance: {kind: documented, source: "docs/profile-format.md \"GitHub pull requests\" table, author_sole_code_owner"}
      - id: green-means-intended-jobs
        statement: "that github_checks.green means the intended jobs ran"
        provenance: {kind: maintainer, date: "2026-10"}
  - component: engine-facts
