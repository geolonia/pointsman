  - {component: action-deploy-watch, dimension: serialization-reconstruction, status: claimed, conditions: "aws CLI JSON reduced to fixed fields; reasons truncated to 300 characters", property_id: P-WATCH-FAILSAFE, provenance: {kind: maintainer, date: "2026-10"}}
  - {component: action-deploy-watch, dimension: reference-lifecycle, status: claimed, conditions: "own process group; SIGTERM then SIGKILL after kill-after-seconds", property_id: P-WATCH-FAILSAFE, provenance: {kind: documented, source: "actions/deploy-watch/README.md \"Inputs\": kill-after-seconds"}}
  - {component: action-deploy-watch, dimension: concurrency-reentrancy, status: not-applicable, conditions: "one watcher per job", provenance: {kind: documented, source: "actions/deploy-watch/README.md"}}
  - {component: action-deploy-watch, dimension: resource-complexity, status: claimed, conditions: "at most one Pointsman call per quiet interval", property_id: P-WATCH-FAILSAFE, provenance: {kind: documented, source: "actions/deploy-watch/README.md \"Rule first\""}}
  - {component: action-deploy-watch, dimension: x-prompt-injection, status: disclaimed, conditions: "stack event text is the prompt; a steered answer can at most stop a deploy after consecutive cancel answers", property_id: D-PROMPT-INJECTION, provenance: {kind: maintainer, date: "2026-10"}}
  - {component: action-deploy-watch, dimension: x-probabilistic-result, status: disclaimed, conditions: "the profile's policy threshold decides cancel", property_id: D-MODEL-ACCURACY, provenance: {kind: documented, source: "actions/deploy-watch/README.md \"Pointsman for unclear cases\""}}
  # connector-github
  - {component: connector-github, dimension: numeric-domain, status: claimed, conditions: "pull-request number a positive whole number, head a 40-character SHA, app id a number; diff 1,000–100,000; recheck 5–120 minutes", property_id: P-CONNECTOR-WEBHOOK-SIGNED, provenance: {kind: documented, source: "docs/github-connector.md \"Chains\", \"Settings\""}}
  - {component: connector-github, dimension: failure-atomicity, status: claimed, conditions: "the record of a check run or action is written first; a stopped run is settled by its trace or redone after 10 minutes; refused actions not retried for that commit; since pointsman#222 (v0.16.0) an answer that fails a check resolves nothing", property_id: P-CONNECTOR-ACTIONS-MAPPED, provenance: {kind: documented, source: "docs/github-connector.md \"Actions\""}}
  - {component: connector-github, dimension: recursive-cyclic-topology, status: claimed, conditions: "its own check suites' events are ignored, so its check runs do not start the next run; since pointsman#216 (v0.15.0) so are events about its own reviews sent by its own bot, except one before the record, one about a review older than the newest 50, or one while its bot's login cannot be read (D-CONNECTOR-OWN-REVIEW-EVENTS)", property_id: P-CONNECTOR-WEBHOOK-SIGNED, provenance: {kind: documented, source: "docs/github-connector.md \"Safety\", \"How it works\", 1"}}
  - {component: connector-github, dimension: callback-execution, status: not-applicable, conditions: "no caller code runs; the action kinds are a fixed list", provenance: {kind: documented, source: "docs/github-connector.md \"Actions\": \"a deployment can switch actions on, never add one\""}}
  - {component: connector-github, dimension: serialization-reconstruction, status: claimed, conditions: "webhook bodies parsed only after the signature check; GitHub answers checked field by field; every field of the engine's answer the connector reads is checked and test decisions are refused; the comment and check runs carry only checked names, cleaned reasons and known answer shapes", property_id: P-CONNECTOR-ANSWER-CHECKED, provenance: {kind: documented, source: "docs/github-connector.md \"Safety\""}}
  - {component: connector-github, dimension: reference-lifecycle, status: claimed, conditions: "its approvals stand only for the commit they were given on; dismissed after a push, withdrawn when a later decision on that commit neither approves nor keeps it, waits for a person, is a test decision or not valid; since pointsman#221 (v0.16.0) a question is kept per head and profile until answered or closed", property_id: P-CONNECTOR-APPROVE-HEAD, provenance: {kind: documented, source: "docs/github-connector.md \"Actions\""}}
  - {component: connector-github, dimension: concurrency-reentrancy, status: claimed, conditions: "one Durable Object per pull request, one run at a time; a burst of events becomes one run; since pointsman#222 (v0.16.0) answers are taken one at a time before the run, and the engine's first resolve wins", property_id: P-CONNECTOR-ACTIONS-MAPPED, provenance: {kind: documented, source: "docs/github-connector.md \"How it works\""}}
  - {component: connector-github, dimension: resource-complexity, status: claimed, conditions: "2 MB per webhook; one run at a time per pull request, 20 s after the last event; lists up to 10 pages; recheck at most max times per commit", property_id: P-CONNECTOR-WEBHOOK-SIGNED, provenance: {kind: documented, source: "docs/github-connector.md \"How it works\", \"Chains\""}}
  - {component: connector-github, dimension: x-prompt-injection, status: disclaimed, conditions: "the pull-request author writes the title, description and diff the profile's model reads; a steered answer gets any action the policy allows for those answers", property_id: D-APPROVAL-ON-FACTS, provenance: {kind: maintainer, date: "2026-10"}}
  - {component: connector-github, dimension: x-probabilistic-result, status: not-applicable, conditions: "the connector maps the decision's action; the comment and check runs show answer values, not probabilities", provenance: {kind: documented, source: "docs/github-connector.md \"The decision comment\", Switch"}}
  # config-repo
  - {component: config-repo, dimension: numeric-domain, status: claimed, conditions: "engine.json ref is a 40-character SHA; profile version is a positive integer that must increase", property_id: P-PROFILE-VERSION-IMMUTABLE, provenance: {kind: documented, source: "docs/deployment.md \"Profile versions\"; template deploy workflow \"Read engine.json\""}}
  - {component: config-repo, dimension: failure-atomicity, status: claimed, conditions: "the deploy stops before any Cloudflare change on a failed check; a changed published version stops the publish", property_id: P-PROFILE-VERSION-IMMUTABLE, provenance: {kind: documented, source: "docs/deployment.md \"What the workflows do\""}}
  - {component: config-repo, dimension: recursive-cyclic-topology, status: not-applicable, conditions: "no graph inputs", provenance: {kind: documented, source: "docs/deployment.md"}}
  - {component: config-repo, dimension: callback-execution, status: claimed, conditions: "workflows run only code from geolonia/pointsman at the pinned commit", property_id: P-PROFILE-VERSION-IMMUTABLE, provenance: {kind: documented, source: "docs/deployment.md \"Updating the engine\""}}
  - {component: config-repo, dimension: serialization-reconstruction, status: claimed, conditions: "profiles validated against the schema and their policy compiled before publication", property_id: P-POLICY-NOT-CODE, provenance: {kind: documented, source: "docs/deployment.md \"Validate\""}}
  - {component: config-repo, dimension: reference-lifecycle, status: claimed, conditions: "old profile versions stay in KV so feedback on old decisions is checked against the version that made them", property_id: P-PROFILE-VERSION-IMMUTABLE, provenance: {kind: documented, source: "docs/deployment.md \"Old versions stay in KV\""}}
  - {component: config-repo, dimension: concurrency-reentrancy, status: claimed, conditions: "deploys run one at a time; D1 registration is strongly consistent", property_id: P-PROFILE-VERSION-IMMUTABLE, provenance: {kind: documented, source: "migrations/0002_profile_versions.sql comment; template deploy workflow concurrency"}}
  - {component: config-repo, dimension: resource-complexity, status: not-applicable, conditions: "a deploy pipeline, not a request path", provenance: {kind: documented, source: "docs/deployment.md"}}
