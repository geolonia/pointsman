dependency_policy:
  zero_runtime_dependencies: false
  provenance: {kind: documented, source: "package.json dependencies"}

dependencies:
  - name: hono
    relied_on_for: "routing: every /v1/* request passes the token middleware before a handler runs; path parameters are what the route says"
    relied_on_properties: [route-middleware-ordering, path-parameter-correctness]
    caller_obligations_acknowledged: []
    adversary_capabilities_forwarded: [send-any-request]
    outputs_consumed: []
    covered_here: false
    violation_disposition: "OUT-OF-MODEL: dependency-contract"
    provenance: {kind: maintainer, date: "2026-10"}
  - name: zod
    relied_on_for: "MCP tool input validation"
    relied_on_properties: [schema-validation-correctness]
    caller_obligations_acknowledged: []
    adversary_capabilities_forwarded: [call-tools-in-scope]
    outputs_consumed: []
