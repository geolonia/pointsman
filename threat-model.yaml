        statement: "GET requests to registry.npmjs.org only, without the GitHub token or any other credential; redirects not followed"
        property_id: P-GITHUB-READ-ONLY
        provenance: {kind: documented, source: "packages/github/src/npm.ts header comment"}
    downstream_must_not_assume:
      - id: registry-does-not-learn-packages
        statement: "that the registry does not learn which packages the deployment's repositories bump"
        provenance: {kind: documented, source: "docs/profile-format.md github_bump row"}
  - component: engine-api
    channel: internal-call-answer
    taint: constrained
    taint_provenance: {kind: documented, source: "docs/adapters.md \"Internal calls\""}
    invariants:
      - id: internal-call-as-configured-client
        statement: "the same status and JSON body as POST /v1/decide, made as the INTERNAL_CLIENT client; configuration errors are 500 not_configured"
