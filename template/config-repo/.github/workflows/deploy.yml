name: Deploy

# On main: applies database migrations, publishes the profiles to KV and
# deploys the engine, all with the pinned engine version.
#
# Needs the repository secrets CLOUDFLARE_API_TOKEN (Workers Scripts, Workers
# KV Storage and D1: Edit) and CLOUDFLARE_ACCOUNT_ID, in the environment
# "production" (protect it with required reviewers if you like).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # The only engine repository these workflows will run.
  ENGINE_REPOSITORY: geolonia/pointsman

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A manual run can be started on any branch; deploy only main.
    if: github.ref == 'refs/heads/main'
    environment: production
    # The Cloudflare secrets are given only to the three steps that call
    # Cloudflare, not to installs or builds.
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # engine.json pins the engine commit. The repository is fixed here, not
      # in engine.json: these steps run the engine's code (in deploy, with the
      # Cloudflare credentials), so a pull request must not be able to point
      # them at another repository. Change ENGINE_REPOSITORY only on purpose.
      - name: Read engine.json
        id: engine
        run: |
          repo=$(jq -r .repository engine.json)
          ref=$(jq -r .ref engine.json)
          [[ "$repo" == "$ENGINE_REPOSITORY" ]] || { echo "::error::engine.json: repository must be $ENGINE_REPOSITORY"; exit 1; }
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::engine.json: ref must be a 40-character commit SHA"; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.ENGINE_REPOSITORY }}
          ref: ${{ steps.engine.outputs.ref }}
          path: engine
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: engine/package.json

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          # No dependency cache in the job that holds deploy credentials.

      - name: Install engine
        run: pnpm --dir engine install --frozen-lockfile

      - name: Check config
        run: node engine/scripts/check-config.mjs

      - name: Validate profiles
        run: node engine/scripts/validate-profiles.mjs profiles

      # Build and dry-run before the first change on Cloudflare, so a broken
      # revision stops here and leaves migrations and profiles untouched.
      - name: Build and dry-run deploy
        run: |
          pnpm --dir engine build
          engine/node_modules/.bin/wrangler deploy --dry-run --config wrangler.jsonc --outdir .wrangler/dry-run

      - name: Apply database migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: engine/node_modules/.bin/wrangler d1 migrations apply DB --remote --config wrangler.jsonc

      # The engine before the profiles: a new engine reads older profiles, but
      # the running engine may not understand a new profile (for example one
      # with facts), and would fail its decisions until the deploy finished.
      - name: Deploy the engine
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: engine/node_modules/.bin/wrangler deploy --config wrangler.jsonc

      # Refuses to change a published id + version; see the script.
      - name: Publish profiles
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node engine/scripts/publish-profiles.mjs --dir profiles --remote --config wrangler.jsonc
