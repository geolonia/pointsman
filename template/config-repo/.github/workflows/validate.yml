name: Validate

# Validates the profiles with the pinned engine (and with it the pinned schema
# version) and dry-runs the deploy. Uses no secrets.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # The only engine repository these workflows will run.
  ENGINE_REPOSITORY: geolonia/pointsman

jobs:
  validate:
    name: Validate profiles and config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The profile version check compares with the pull request's base.
          fetch-depth: 0

      # engine.json pins the engine commit. The repository is fixed here, not
      # in engine.json: these steps run the engine's code (in deploy, with the
      # Cloudflare credentials), so a pull request must not be able to point
      # them at another repository. Change ENGINE_REPOSITORY only on purpose.
      - name: Read engine.json
        id: engine
        run: |
          repo=$(jq -r .repository engine.json)
          ref=$(jq -r .ref engine.json)
          [[ "$repo" == "$ENGINE_REPOSITORY" ]] || { echo "::error::engine.json: repository must be $ENGINE_REPOSITORY"; exit 1; }
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::engine.json: ref must be a 40-character commit SHA"; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.ENGINE_REPOSITORY }}
          ref: ${{ steps.engine.outputs.ref }}
          path: engine
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: engine/package.json

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: engine/pnpm-lock.yaml

      - name: Install engine
        run: pnpm --dir engine install --frozen-lockfile

      - name: Check config
        run: node engine/scripts/check-config.mjs

      - name: Validate profiles
        run: node engine/scripts/validate-profiles.mjs profiles

      # A changed profile needs a higher version: a published version never
      # changes, and the deploy would stop after the merge. Make this job a
      # required status check on main (see README).
      - name: Check profile versions
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node engine/scripts/check-profile-versions.mjs --base "$BASE_SHA" profiles

      - name: Dry-run deploy
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          pnpm --dir engine build
          engine/node_modules/.bin/wrangler deploy --dry-run --config wrangler.jsonc --outdir .wrangler/dry-run
