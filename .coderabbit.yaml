# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# Inherits the org-wide CodeRabbit defaults from geolonia/coderabbit. Without
# `inheritance: true` this file would replace them entirely, including the
# setting that lets CodeRabbit approve pull requests.

inheritance: true

reviews:
  # No review, summary or status comment on its own: CodeRabbit reviews only
  # when asked (`@coderabbitai review`, or a paid review), so a draft, a push
  # or a ready PR spends nothing and adds no notice. The reviews are asked
  # for through the pr-review-flow skill's review-next for now; later
  # Pointsman itself may ask (a connector action, not built yet).
  review_status: false
  # Keep the commit status "CodeRabbit" on every head: Pointsman's CodeRabbit
  # facts and review-next read it (installed, reviewed, rate limited).
  commit_status: true
  auto_review:
    enabled: false
    # Only matters if automatic reviews are switched on again.
    # Release PRs only move the version and add the changelog entry, yet
    # touch many files; Pointsman approves them on facts alone (the release
    # class, geolonia/pointsman#149), which needs CodeRabbit not to have
    # reviewed them. CodeRabbit matches keywords anywhere in the title,
    # case-insensitive, so plain "Release" would also skip titles such as
    # "github_release". Change to "Release 1." at version 1.0.0.
    ignore_title_keywords:
      - "Release 0."

# Repository-specific overrides go below. Examples:
#
# language: en-US              # the org default is Japanese
#
# reviews:
#   profile: assertive         # more thorough, and noisier
#   path_filters:
#     - "!**/*.snap"
#     - "!**/fixtures/**"
#   auto_review:
#     ignore_title_keywords:
#       - "chore(deps)"
