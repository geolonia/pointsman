apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  namespace: geolonia
  name: pointsman
  description: Model-agnostic decision service. Typed questions in; typed answers, probabilities and an action out.
  annotations:
    github.com/project-slug: geolonia/pointsman
  tags: ['service', 'cloudflare-workers', 'decision-models']
spec:
  type: 'service'
  lifecycle: 'experimental'
  owner: group:geolonia/geonicdb
  system: system:geolonia/standards
  providesApis:
    - api:geolonia/pointsman-api
  # accessGrants:
  #   - team: group:geolonia/team-name
  #     permission: write  # read | triage | write | maintain | admin
---
